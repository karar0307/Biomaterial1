quiz:[
{q:[`Why is carbon reduced from 0.08% to 0.03% in 316L?`,`لماذا يُخفض الكربون من 0.08% إلى 0.03% في 316L؟`],o:[[`To make it magnetic`,`ليصبح مغناطيسياً`],[`To reduce carbide formation and Cr depletion, avoiding intergranular corrosion`,`لتقليل تكوّن الكربيدات ونضوب Cr وتجنب التآكل بين الحبيبات`],[`To raise the density`,`لرفع الكثافة`],[`To allow heat hardening`,`ليسمح بالتصليد الحراري`]],a:1,e:[`Fewer carbides means chromium stays in the grain regions.`,`كربيدات أقل تعني بقاء الكروم في مناطق الحبيبات.`]},
{q:[`316L can be strengthened by:`,`يمكن تقوية 316L عن طريق:`],o:[[`Quench hardening`,`التصليد بالتبريد السريع`],[`Cold working`,`التشغيل على البارد`],[`Martensitic transformation`,`التحول المارتنسيتي`],[`Cooling slowly`,`التبريد البطيء`]],a:1,e:[`It stays austenitic, so only cold working hardens it.`,`يبقى أوستنيتياً لذا لا يصلّده إلا التشغيل على البارد.`]},
{q:[`Minimum chromium for corrosion resistance in stainless steel:`,`أدنى نسبة كروم لمقاومة التآكل في الفولاذ المقاوم للصدأ:`],o:[[`2%`,`2%`],[`5%`,`5%`],[`11%`,`11%`],[`30%`,`30%`]],a:2,e:[`11% Cr is the minimum effective concentration.`,`نسبة 11% هي أدنى تركيز فعّال.`]},
{q:[`Which alloy is hot forged for hip prosthesis stems?`,`أي سبيكة تُطرق ساخنة لسيقان أطقم الورك؟`],o:[[`Wrought CoNiCrMo`,`CoNiCrMo المطاوعة`],[`Vanadium steel`,`فاناديوم ستيل`],[`Pure Ti grade 1`,`Ti نقي رتبة 1`],[`Type 302`,`النوع 302`]],a:0,e:[`Only hot forging can shape large CoNiCrMo implants.`,`الطرق الساخن وحده يشكّل غرسات CoNiCrMo الكبيرة.`]},
{q:[`In titanium alloys, which element stabilizes the β phase?`,`في سبائك التيتانيوم أي عنصر يثبّت الطور β؟`],o:[[`Aluminum`,`الألمنيوم`],[`Vanadium`,`الفاناديوم`],[`Oxygen`,`الأكسجين`],[`Iron oxide`,`أكسيد الحديد`]],a:1,e:[`Al stabilizes α; V lowers the α→β temperature.`,`Al يثبّت α وV يخفض درجة تحول α→β.`]},
{q:[`Titanium resists corrosion because of:`,`يقاوم التيتانيوم التآكل بسبب:`],o:[[`A TiO₂ layer about 10 nm thick`,`طبقة TiO₂ سماكتها نحو 10 نانومتر`],[`High nickel content`,`محتوى نيكل عالٍ`],[`High carbon`,`كربون عالٍ`],[`Its high density`,`كثافته العالية`]],a:0,e:[`The solid oxide layer protects the metal.`,`طبقة الأكسيد الصلبة تحمي المعدن.`]},
{q:[`Correct order of precipitation hardening:`,`الترتيب الصحيح للتصلد بالترسيب:`],o:[[`Aging, quenching, solution treating`,`تعتيق ثم تبريد سريع ثم معالجة بالمحلول`],[`Solution treating, quenching, aging`,`معالجة بالمحلول ثم تبريد سريع ثم تعتيق`],[`Quenching, aging, solution treating`,`تبريد سريع ثم تعتيق ثم معالجة بالمحلول`],[`Cold working, aging, quenching`,`تشغيل على البارد ثم تعتيق ثم تبريد سريع`]],a:1,e:[`Dissolve solute, trap it by rapid cooling, then let fine precipitates form.`,`تذويب المذاب ثم حبسه بالتبريد السريع ثم ترك الرواسب الدقيقة تتكوّن.`]},
{q:[`Strain hardening happens because plastic deformation increases:`,`يحدث التصلب بالانفعال لأن التشوه اللدن يزيد:`],o:[[`Grain size`,`حجم الحبيبات`],[`Dislocation density`,`كثافة الانخلاعات`],[`Chromium content`,`محتوى الكروم`],[`Temperature`,`درجة الحرارة`]],a:1,e:[`Dislocation–dislocation interactions resist further deformation.`,`تفاعلات الانخلاعات مع بعضها تقاوم التشوه اللاحق.`]}]};
D[3]={title:[`Phase Diagrams`,`مخططات الأطوار`],src:`Phase Diagrams`,blocks:[
{t:'sec',h:[`Basic concepts`,`المفاهيم الأساسية`],p:[
[`Phase diagrams matter because microstructure strongly correlates with mechanical properties.`,`تكمن أهمية مخططات الأطوار في أن البنية المجهرية ترتبط ارتباطاً قوياً بالخواص الميكانيكية.`]],u:[
[`<b>System:</b> the series of possible alloys made of the same components, regardless of composition (e.g. the iron–carbon system).`,`<b>المنظومة:</b> سلسلة السبائك الممكنة المكوّنة من المكونات نفسها بغض النظر عن التركيب (مثل منظومة الحديد–كربون).`],
[`<b>Solid solution:</b> atoms of at least two types; solute atoms sit in substitutional or interstitial positions in the solvent lattice.`,`<b>المحلول الصلب:</b> ذرات من نوعين على الأقل؛ تحتل ذرات المذاب مواقع إحلالية أو بينية في شبكة المذيب.`],
[`<b>Solubility limit:</b> the maximum solute concentration that dissolves in the solvent. Beyond it, another solid solution or compound with a clearly different composition forms.`,`<b>حد الذوبانية:</b> أقصى تركيز من المذاب يذوب في المذيب. وما زاد عنه يكوّن محلولاً صلباً آخر أو مركباً بتركيب مختلف بوضوح.`],
[`<b>Phase:</b> a homogeneous portion of a system with uniform physical and chemical characteristics. Every pure material, and every solid, liquid or gaseous solution, is a phase.`,`<b>الطور:</b> جزء متجانس من المنظومة له خواص فيزيائية وكيميائية موحدة. كل مادة نقية، وكل محلول صلب أو سائل أو غازي، يُعد طوراً.`]]},
{t:'tabs',h:[`Types of phase diagram`,`أنواع مخططات الأطوار`],items:[
{n:[`Isomorphous`,`متشاكل`],p:[[`Cu–Ni: the liquids mix in all proportions and the solids form one substitutional solid solution α over the whole range. Both are FCC, so α is FCC.`,`Cu–Ni: تمتزج السوائل بكل النسب وتكوّن الصلبة محلولاً صلباً إحلالياً واحداً α على كامل المدى. وكلا الفلزين FCC لذا فإن α هو FCC.`],
  [`Melting points: Ni 1458 °C (point A) and Cu 1083 °C (point C). An alloy freezes over a <b>freezing range</b>. The line ABC is the <b>liquidus</b>, the line ADC is the <b>solidus</b>, and between them L + α coexist.`,`نقطتا الانصهار: Ni عند 1458 °م (النقطة A) وCu عند 1083 °م (النقطة C). تتجمد السبيكة ضمن <b>مدى تجمد</b>. الخط ABC هو <b>الليكويدس</b> والخط ADC هو <b>السوليدس</b>، وبينهما يتعايش L + α.`]],note:[`Liquid ⇌ α (cooling ⟶, heating ⟵).`,`سائل ⇌ α (تبريد ⟶، تسخين ⟵).`]},
{n:[`Eutectic`,`يوتكتيكي`],p:[[`Reaction: Liquid ⇌ α + β, at one specific composition (eutectic composition) and one temperature (eutectic temperature). "Eutectic" means low melting: it is the lowest melting temperature in the system.`,`التفاعل: سائل ⇌ α + β عند تركيب محدد (التركيب اليوتكتيكي) ودرجة حرارة محددة (درجة الحرارة اليوتكتيكية). ومعنى "يوتكتيكي" هو الانصهار المنخفض: وهي أدنى درجة انصهار في المنظومة.`]],
  u:[[`<b>Case 1, no solid solubility (Cd–Bi):</b> Liquid ⇌ A + B. Eutectic at 140 °C and 60% Bi / 40% Cd; Bi melts at 321 °C and Cd at 271 °C.`,`<b>الحالة 1، دون ذوبانية صلبة (Cd–Bi):</b> سائل ⇌ A + B. اليوتكتيك عند 140 °م وبتركيب 60% Bi / 40% Cd؛ ينصهر Bi عند 321 °م وCd عند 271 °م.`],
  [`<b>Case 2, with solid solutions (Sn–Pb):</b> α is Sn dissolved in Pb, β is Pb dissolved in Sn. Eutectic alloy: 61.9% Sn, 38.1% Pb, at 183 °C.`,`<b>الحالة 2، مع محاليل صلبة (Sn–Pb):</b> α هو Sn مذاب في Pb وβ هو Pb مذاب في Sn. السبيكة اليوتكتيكية: 61.9% Sn و38.1% Pb عند 183 °م.`]]},
{n:[`Peritectic`,`بيريتكتيكي`],p:[[`Reaction: Liquid + β ⇌ α, at a specific peritectic temperature, giving α of a specific composition. It usually occurs when the two metals have widely different melting points. Example: Ag–Pt.`,`التفاعل: سائل + β ⇌ α عند درجة حرارة بيريتكتيكية محددة وينتج α بتركيب محدد. يحدث عادةً حين تكون نقطتا انصهار الفلزين متباعدتين كثيراً. مثال: Ag–Pt.`]]},
{n:[`Eutectoid`,`يوتكتويدي`],p:[[`Upon cooling, one solid phase transforms into two other solid phases: S1 ⇌ S2 + S3 (reverse on heating). What separates eutectoid from eutectic is that a <b>solid</b>, not a liquid, transforms into two solids at a single temperature. It occurs in the iron–carbon system.`,`عند التبريد يتحول طور صلب واحد إلى طورين صلبين آخرين: S1 ⇌ S2 + S3 (والعكس عند التسخين). الفرق بين اليوتكتويدي واليوتكتيكي أن الذي يتحول هو <b>صلب</b> وليس سائلاً، إلى صلبين عند درجة حرارة واحدة. ويوجد في منظومة الحديد–كربون.`]]}]},
{t:'sec',h:[`Microstructure development in a eutectic system`,`تطور البنية المجهرية في منظومة يوتكتيكية`],u:[
[`<b>Eutectic alloy</b> solidifies like a pure metal at the eutectic temperature, which is lower than the melting points of either metal. Its structure has two phases, whose amounts follow from the lever rule.`,`<b>السبيكة اليوتكتيكية</b> تتجمد كمعدن نقي عند درجة الحرارة اليوتكتيكية الأقل من نقطتي انصهار الفلزين. بنيتها من طورين تُحسب كمياتهما بقاعدة الرافعة.`],
[`<b>Hypoeutectic alloy</b> (less than 60% Bi in Cd–Bi) solidifies in two stages: primary Cd separates from the liquid between T1 and T<sub>E</sub>; then the remaining liquid, now at eutectic composition, freezes as eutectic structure. Use the lever rule just above T<sub>E</sub>.`,`<b>السبيكة تحت اليوتكتيكية</b> (أقل من 60% Bi في Cd–Bi) تتجمد على مرحلتين: يتفصل Cd الأولي من السائل بين T1 وT<sub>E</sub>؛ ثم يتجمد السائل المتبقي، وقد صار بتركيب يوتكتيكي، كبنية يوتكتيكية. تُطبَّق قاعدة الرافعة فوق T<sub>E</sub> مباشرة.`],
[`<b>Hypereutectic</b> alloys follow the same logic on the other side.`,`<b>السبائك فوق اليوتكتيكية</b> تتبع المنطق نفسه من الجهة الأخرى.`]]},
{t:'tabs',h:[`The four Pb–Sn microstructure cases`,`الحالات الأربع للبنية المجهرية في Pb–Sn`],items:[
{n:[`1`,`1`],p:[[`Compositions between pure Pb and the maximum room-temperature solubility (about 0 to 2 wt% Sn): a single α solid solution.`,`تراكيب بين Pb النقي وأقصى ذوبانية عند حرارة الغرفة (نحو 0 إلى 2% Sn): محلول صلب α واحد.`]]},
{n:[`2`,`2`],p:[[`From the room-temperature solubility limit up to the maximum solubility at the eutectic temperature (about 2 to 18.3 wt% Sn, Pb-rich alloys).`,`من حد الذوبانية عند حرارة الغرفة حتى أقصى ذوبانية عند الدرجة اليوتكتيكية (نحو 2 إلى 18.3% Sn، سبائك غنية بالرصاص).`]]},
{n:[`3`,`3`],p:[[`The eutectic composition, 61.9 wt% Sn. Nothing changes until 183 °C; crossing the eutectic isotherm the liquid transforms into α and β together.`,`التركيب اليوتكتيكي 61.9% Sn. لا يتغير شيء حتى 183 °م؛ وعند عبور خط اليوتكتيك يتحول السائل إلى α وβ معاً.`]]},
{n:[`4`,`4`],p:[[`All compositions between the maximum solubility at the eutectic temperature and the eutectic point.`,`كل التراكيب بين أقصى ذوبانية عند الدرجة اليوتكتيكية والنقطة اليوتكتيكية.`]]}]},
{t:'w',k:'phase'},
{t:'sec',h:[`The iron–iron carbide (Fe–Fe₃C) diagram`,`مخطط الحديد–كربيد الحديد (Fe–Fe₃C)`],p:[
[`Alloys with less than 2% carbon are <b>steels</b>; more than 2% are <b>cast irons</b>. The diagram has three invariant reactions:`,`السبائك التي فيها أقل من 2% كربون هي <b>فولاذ</b>، وما زاد عن ذلك <b>حديد زهر</b>. يحوي المخطط ثلاثة تفاعلات ثابتة:`]],u:[
[`<b>Peritectic</b> at 1493 °C: Liquid + δ ⇌ γ (minor importance)`,`<b>بيريتكتيكي</b> عند 1493 °م: سائل + δ ⇌ γ (أهمية ثانوية)`],
[`<b>Eutectic</b> at 1147 °C: Liquid ⇌ γ + Fe₃C (important for cast iron)`,`<b>يوتكتيكي</b> عند 1147 °م: سائل ⇌ γ + Fe₃C (مهم للحديد الزهر)`],
[`<b>Eutectoid</b> at 727 °C: γ ⇌ α + Fe₃C (important for steel)`,`<b>يوتكتويدي</b> عند 727 °م: γ ⇌ α + Fe₃C (مهم للفولاذ)`]]},
{t:'table',h:[`Phases of iron and carbon`,`أطوار الحديد والكربون`],cols:[[`Phase`,`الطور`],[`Structure`,`البنية`],[`Notes`,`ملاحظات`]],rows:[
[[`Ferrite (α)`,`الفريت (α)`],`BCC`,[`Stable at room temperature. Max carbon solubility 0.022 wt% at 727 °C.`,`مستقر عند حرارة الغرفة. أقصى ذوبانية للكربون 0.022% عند 727 °م.`]],
[[`Austenite (γ)`,`الأوستنيت (γ)`],`FCC`,[`Forms from ferrite at 912 °C. Max carbon solubility 2.14 wt% at 1147 °C.`,`يتكوّن من الفريت عند 912 °م. أقصى ذوبانية للكربون 2.14% عند 1147 °م.`]],
[[`δ ferrite`,`فريت δ`],`BCC`,[`Austenite returns to BCC at 1493 °C; melts at 1538 °C.`,`يعود الأوستنيت إلى BCC عند 1493 °م؛ ويذوب عند 1538 °م.`]],
[[`Cementite (Fe₃C)`,`السمنتيت (Fe₃C)`],`—`,[`Intermediate compound at 6.7 wt% C (= 100 wt% Fe₃C). Very hard and brittle; raises the strength of some steels.`,`مركب وسيط عند 6.7% C (= 100% Fe₃C). صلب وهش جداً؛ يرفع مقاومة بعض الفولاذات.`]]],
note:[`Carbon is an interstitial impurity in iron and forms interstitial solid solutions with α, δ and γ.`,`الكربون شائبة بينية في الحديد ويكوّن محاليل صلبة بينية مع α وδ وγ.`]},
{t:'w',k:'fec'},
{t:'tabs',h:[`Microstructures of slow-cooled steel`,`البنى المجهرية للفولاذ المبرّد ببطء`],items:[
{n:[`Eutectoid (0.76% C)`,`يوتكتويدي (0.76% C)`],p:[[`Above 727 °C the alloy is entirely austenite. At the eutectoid temperature austenite transforms into alternating lamellae of α ferrite and Fe₃C, formed together. This is <b>pearlite</b>.`,`فوق 727 °م تكون السبيكة كلها أوستنيت. عند الدرجة اليوتكتويدية يتحول الأوستنيت إلى صفائح متناوبة من فريت α وFe₃C تتكوّن معاً. وهذا هو <b>البيرلايت</b>.`]],note:[`The slide text says "above 527 °C", which looks like a typo: the alloy is fully austenite just above 727 °C.`,`يذكر نص الشريحة "فوق 527 °م"، ويبدو أنه خطأ مطبعي: تكون السبيكة أوستنيتاً كاملاً فوق 727 °م مباشرة.`]},
{n:[`Hypoeutectoid (0.022–0.76% C)`,`تحت يوتكتويدي (0.022–0.76% C)`],p:[[`At about 875 °C it is all γ. In the α + γ region (about 775 °C) small α particles form along the original γ grain boundaries. Just above 727 °C, α holds 0.022 wt% C and γ has the eutectoid composition 0.76 wt% C (tie line). Below 727 °C the γ becomes pearlite; the earlier α (proeutectoid α) stays as a continuous matrix around pearlite colonies.`,`عند نحو 875 °م تكون كلها γ. وفي منطقة α + γ (نحو 775 °م) تتكوّن جسيمات α صغيرة على حدود حبيبات γ الأصلية. فوق 727 °م مباشرة يحوي α نسبة 0.022% C ولـγ التركيب اليوتكتويدي 0.76% C (خط الربط). وتحت 727 °م يتحول γ إلى بيرلايت، ويبقى α السابق (α أولي) كأساس متصل حول مستعمرات البيرلايت.`]]},
{n:[`Hypereutectoid (0.76–2.14% C)`,`فوق يوتكتويدي (0.76–2.14% C)`],p:[[`At point g it is all γ. In the γ + Fe₃C field, cementite forms along the γ grain boundaries: <b>proeutectoid cementite</b>, of constant composition 6.70 wt% C. The austenite composition moves toward the eutectoid, and below 727 °C it all converts to pearlite. Result: pearlite plus proeutectoid cementite (a network around the colonies).`,`عند النقطة g تكون كلها γ. وفي حقل γ + Fe₃C يتكوّن السمنتيت على حدود حبيبات γ: <b>السمنتيت الأولي</b> بتركيب ثابت 6.70% C. يتحرك تركيب الأوستنيت نحو التركيب اليوتكتويدي، وتحت 727 °م يتحول كله إلى بيرلايت. النتيجة: بيرلايت مع سمنتيت أولي (شبكة حول المستعمرات).`]]}]}],
cards:[
[`Phase`,`الطور`,`A homogeneous portion of a system with uniform physical and chemical characteristics.`,`جزء متجانس من المنظومة له خواص فيزيائية وكيميائية موحدة.`],
[`Solubility limit`,`حد الذوبانية`,`Maximum solute concentration that dissolves in the solvent.`,`أقصى تركيز من المذاب يذوب في المذيب.`],
[`Liquidus / Solidus`,`الليكويدس / السوليدس`,`Liquidus: temperature above which the alloy is fully liquid. Solidus: below which it is fully solid.`,`الليكويدس: ما فوقه تكون السبيكة سائلة كلياً. السوليدس: ما تحته تكون صلبة كلياً.`],
[`Eutectic reaction`,`التفاعل اليوتكتيكي`,`Liquid ⇌ α + β at the lowest melting temperature of the system.`,`سائل ⇌ α + β عند أدنى درجة انصهار في المنظومة.`],
[`Peritectic reaction`,`التفاعل البيريتكتيكي`,`Liquid + β ⇌ α.`,`سائل + β ⇌ α.`],
[`Eutectoid reaction`,`التفاعل اليوتكتويدي`,`One solid phase transforms into two other solids: S1 ⇌ S2 + S3. In steel: γ ⇌ α + Fe₃C at 727 °C.`,`طور صلب واحد يتحول إلى صلبين آخرين: S1 ⇌ S2 + S3. في الفولاذ: γ ⇌ α + Fe₃C عند 727 °م.`],
[`Pearlite`,`البيرلايت`,`Alternating lamellae of α ferrite and cementite formed from austenite at the eutectoid.`,`صفائح متناوبة من فريت α وسمنتيت تتكوّن من الأوستنيت عند النقطة اليوتكتويدية.`],
[`Steel vs. cast iron`,`الفولاذ مقابل الحديد الزهر`,`Steel: < 2% C. Cast iron: > 2% C.`,`الفولاذ: أقل من 2% C. الحديد الزهر: أكثر من 2% C.`],
[`Cementite`,`السمنتيت`,`Fe₃C, 6.7 wt% C; very hard and brittle.`,`Fe₃C بنسبة 6.7% C؛ صلب وهش جداً.`]],
quiz:[
{q:[`Which line of a phase diagram separates "liquid" from "liquid + solid"?`,`أي خط في مخطط الأطوار يفصل "سائل" عن "سائل + صلب"؟`],o:[[`Solidus`,`السوليدس`],[`Liquidus`,`الليكويدس`],[`Solvus`,`السولفس`],[`Tie line`,`خط الربط`]],a:1,e:[`ABC is the liquidus; ADC is the solidus.`,`الخط ABC هو الليكويدس والخط ADC هو السوليدس.`]},
{q:[`The reaction Liquid ⇌ α + β is:`,`التفاعل سائل ⇌ α + β هو:`],o:[[`Peritectic`,`بيريتكتيكي`],[`Eutectoid`,`يوتكتويدي`],[`Eutectic`,`يوتكتيكي`],[`Isomorphous`,`متشاكل`]],a:2,e:[`A liquid transforming into two solids at one temperature is eutectic.`,`تحول سائل إلى صلبين عند درجة واحدة هو تفاعل يوتكتيكي.`]},
{q:[`What distinguishes eutectoid from eutectic?`,`ما الفرق بين اليوتكتويدي واليوتكتيكي؟`],o:[[`A solid, not a liquid, transforms`,`الذي يتحول طور صلب وليس سائلاً`],[`It is always above 1000 °C`,`يكون دائماً فوق 1000 °م`],[`It forms only in steels with Ni`,`يتكون فقط في فولاذ فيه Ni`],[`It has three phases`,`له ثلاثة أطوار`]],a:0,e:[`S1 ⇌ S2 + S3 is a solid-state reaction.`,`التفاعل S1 ⇌ S2 + S3 تفاعل في الحالة الصلبة.`]},
{q:[`The Sn–Pb eutectic alloy is:`,`السبيكة اليوتكتيكية لـ Sn–Pb هي:`],o:[[`61.9% Sn at 183 °C`,`61.9% Sn عند 183 °م`],[`40% Sn at 140 °C`,`40% Sn عند 140 °م`],[`18.3% Sn at 183 °C`,`18.3% Sn عند 183 °م`],[`61.9% Sn at 321 °C`,`61.9% Sn عند 321 °م`]],a:0,e:[`140 °C is the Cd–Bi eutectic temperature, not Sn–Pb.`,`140 °م هي درجة اليوتكتيك لـ Cd–Bi وليس Sn–Pb.`]},
{q:[`Steel is defined as an Fe–C alloy with carbon below:`,`يُعرَّف الفولاذ بأنه سبيكة Fe–C ذات كربون أقل من:`],o:[[`0.022%`,`0.022%`],[`0.76%`,`0.76%`],[`2%`,`2%`],[`6.7%`,`6.7%`]],a:2,e:[`Above 2% C the alloy is cast iron.`,`فوق 2% C تكون السبيكة حديداً زهراً.`]},
{q:[`The eutectoid composition and temperature of steel are:`,`التركيب والحرارة اليوتكتويديان للفولاذ هما:`],o:[[`0.76 wt% C, 727 °C`,`0.76% C و727 °م`],[`2.14 wt% C, 1147 °C`,`2.14% C و1147 °م`],[`0.022 wt% C, 912 °C`,`0.022% C و912 °م`],[`4.3 wt% C, 727 °C`,`4.3% C و727 °م`]],a:0,e:[`Austenite of 0.76 wt% C becomes pearlite at 727 °C.`,`يتحول أوستنيت 0.76% C إلى بيرلايت عند 727 °م.`]},
{q:[`A 0.40 wt% C steel is cooled slowly below 727 °C. What is the proeutectoid ferrite fraction? (lever rule with 0.022 and 0.76)`,`فولاذ 0.40% C بُرّد ببطء تحت 727 °م. ما كسر الفريت الأولي؟ (قاعدة الرافعة مع 0.022 و0.76)`],o:[[`0.49`,`0.49`],[`0.51`,`0.51`],[`0.40`,`0.40`],[`0.76`,`0.76`]],a:0,e:[`(0.76 − 0.40) / (0.76 − 0.022) = 0.488, about 0.49.`,`(0.76 − 0.40) / (0.76 − 0.022) = 0.488 أي نحو 0.49.`]},
{q:[`Cementite has a composition of:`,`تركيب السمنتيت هو:`],o:[[`0.76 wt% C`,`0.76% C`],[`2.14 wt% C`,`2.14% C`],[`6.7 wt% C`,`6.7% C`],[`100 wt% C`,`100% C`]],a:2,e:[`Fe₃C corresponds to 6.7 wt% C.`,`يقابل Fe₃C نسبة 6.7% C.`]}]};
D[4]={title:[`Bioceramics: Crystal Structures`,`السيراميك الحيوي: البنى البلورية`],src:`Bioceramics / Crystal Structure`,blocks:[
{t:'sec',h:[`Why ceramic crystals are more complex`,`لماذا بنى السيراميك البلورية أكثر تعقيداً`],p:[
[`Ceramics contain at least two elements, often more, so their crystal structures are generally more complex than those of metals. Bonding ranges from purely ionic to totally covalent, and many ceramics mix both. The degree of ionic character depends on the electronegativities of the atoms.`,`يتكوّن السيراميك من عنصرين على الأقل وغالباً أكثر، لذا فبناه البلورية أعقد عموماً من بنى المعادن. يتراوح الترابط من أيوني بحت إلى تساهمي تام، وكثير من السيراميكات تجمع النوعين. وتعتمد درجة الصفة الأيونية على السالبية الكهربية للذرات.`],
[`When bonding is mostly ionic, the crystal is pictured as electrically charged <b>ions</b> rather than atoms.`,`وعندما يكون الترابط أيونياً في الغالب تُتخيل البلورة كـ<b>أيونات</b> مشحونة كهربائياً وليس كذرات.`]]},
{t:'tabs',h:[`Two characteristics that shape the structure`,`خاصيتان تحددان البنية`],items:[
{n:[`1 Charge`,`1 الشحنة`],p:[[`The crystal must be electrically neutral: all cation positive charges are balanced by an equal total of anion negative charges.`,`يجب أن تكون البلورة متعادلة كهربائياً: كل الشحنات الموجبة للكاتيونات توازنها شحنات الأنيونات السالبة بالمقدار نفسه.`],
  [`Example: in CaF₂ each calcium is Ca²⁺ and each fluorine is F⁻, so there must be twice as many F⁻ as Ca²⁺. That is why the formula is CaF₂.`,`مثال: في CaF₂ كل كالسيوم Ca²⁺ وكل فلور F⁻، لذا يجب أن يكون عدد F⁻ ضعف عدد Ca²⁺. ولهذا الصيغة CaF₂.`]]},
{n:[`2 Size`,`2 الحجم`],p:[[`Metals give up electrons when ionized, so cations are usually smaller than anions and the ratio r<sub>C</sub>/r<sub>A</sub> is less than 1.`,`تفقد الفلزات إلكترونات عند التأين، لذا تكون الكاتيونات عادةً أصغر من الأنيونات وتكون النسبة r<sub>C</sub>/r<sub>A</sub> أقل من 1.`],
  [`Each cation wants as many anion neighbors as possible. A stable structure forms when all anions around a cation touch it. For each coordination number there is a minimum r<sub>C</sub>/r<sub>A</sub> that allows this contact, found from pure geometry.`,`يفضّل كل كاتيون أكبر عدد ممكن من الأنيونات المجاورة. وتتكوّن البنية المستقرة حين تلامس كل الأنيونات المحيطة بالكاتيون. ولكل عدد تنسيق نسبة r<sub>C</sub>/r<sub>A</sub> دنيا تسمح بهذا التلامس، وتُحسب من الهندسة البحتة.`]]}]},
{t:'table',h:[`Radius ratio and coordination number`,`نسبة أنصاف الأقطار وعدد التنسيق`],cols:[[`r<sub>C</sub>/r<sub>A</sub>`],[`Coordination number`,`عدد التنسيق`],[`Cation sits at the center of`,`يقع الكاتيون في مركز`]],rows:[
[`&lt; 0.155`,`2`,[`A line (linear)`,`خط (خطي)`]],[`0.155 – 0.225`,`3`,[`A planar equilateral triangle`,`مثلث متساوي الأضلاع مستوٍ`]],[`0.225 – 0.414`,`4`,[`A tetrahedron`,`رباعي أوجه`]],[`0.414 – 0.732`,`6`,[`An octahedron`,`ثماني أوجه`]],[`0.732 – 1.0`,`8`,[`A cube (anions at the corners)`,`مكعب (الأنيونات في الأركان)`]]]},
{t:'w',k:'ratio'},
{t:'rev',h:[`Worked example 6-1: minimum ratio for coordination number 3`,`مثال محلول 6-1: النسبة الدنيا لعدد التنسيق 3`],p:[[`Show that the minimum cation-to-anion radius ratio for coordination number 3 is 0.155.`,`أثبت أن النسبة الدنيا بين نصفي قطري الكاتيون والأنيون لعدد التنسيق 3 هي 0.155.`]],run:()=>{
  const v=2/Math.sqrt(3)-1;
  return bi([`<b>1.</b> Three anions of radius r<sub>A</sub> touch each other at the corners of an equilateral triangle, so the side of the triangle is 2r<sub>A</sub>.`,`<b>1.</b> ثلاثة أنيونات نصف قطر كل منها r<sub>A</sub> تتلامس عند رؤوس مثلث متساوي الأضلاع، فضلع المثلث 2r<sub>A</sub>.`])+
  bi([`<b>2.</b> The cation sits at the centroid. The centroid-to-corner distance in an equilateral triangle of side s is s/√3 = 2r<sub>A</sub>/√3.`,`<b>2.</b> يقع الكاتيون في مركز المثلث. والمسافة من المركز إلى الرأس في مثلث متساوي الأضلاع ضلعه s هي s/√3 = 2r<sub>A</sub>/√3.`])+
  bi([`<b>3.</b> Contact means this distance equals r<sub>A</sub> + r<sub>C</sub>: 2r<sub>A</sub>/√3 = r<sub>A</sub> + r<sub>C</sub>.`,`<b>3.</b> التلامس يعني أن هذه المسافة تساوي r<sub>A</sub> + r<sub>C</sub>: 2r<sub>A</sub>/√3 = r<sub>A</sub> + r<sub>C</sub>.`])+
  bi([`<b>4.</b> Therefore r<sub>C</sub>/r<sub>A</sub> = 2/√3 − 1 = <b>${v.toFixed(3)}</b> ≈ 0.155.`,`<b>4.</b> إذن r<sub>C</sub>/r<sub>A</sub> = 2/√3 − 1 = <b>${v.toFixed(3)}</b> ≈ 0.155.`])}},
{t:'sec',h:[`AX-type structures (equal numbers of cations and anions)`,`بنى النوع AX (أعداد متساوية من الكاتيونات والأنيونات)`],p:[[`Each structure is named after a common material that has it.`,`تُسمّى كل بنية باسم مادة شائعة تتخذها.`]]},
{t:'table',cols:[[`Structure`,`البنية`],[`Coordination`,`التنسيق`],[`Unit cell`,`الخلية الوحدة`],[`Examples`,`أمثلة`]],rows:[
[[`Rock salt (NaCl)`,`ملح الصخر (NaCl)`],[`6 for both ions (r<sub>C</sub>/r<sub>A</sub> ≈ 0.414–0.732)`,`6 لكلا الأيونين (r<sub>C</sub>/r<sub>A</sub> ≈ 0.414–0.732)`],[`FCC array of anions; cations at the cube center and at the center of each of 12 edges. Equivalent to two interpenetrating FCC lattices.`,`ترتيب FCC للأنيونات؛ والكاتيونات في مركز المكعب وفي منتصف كل حرف من الأحرف الـ12. تكافئ شبكتين FCC متداخلتين.`],`NaCl, MgO, MnS, LiF, FeO`],
[[`Cesium chloride (CsCl)`,`كلوريد السيزيوم (CsCl)`],[`8 for both ions`,`8 لكلا الأيونين`],[`Anions at the cube corners; a single cation at the center.`,`الأنيونات في أركان المكعب؛ وكاتيون واحد في المركز.`],`CsCl`],
[[`Zinc blende (ZnS)`,`الزنك بلند (ZnS)`],[`4 (all ions tetrahedral)`,`4 (كل الأيونات رباعية الأوجه)`],[`S at all corner and face positions; Zn fills interior tetrahedral positions. Bonding is highly covalent.`,`S في كل مواضع الأركان والأوجه؛ وZn يملأ المواضع الرباعية الداخلية. الترابط تساهمي بدرجة عالية.`],`ZnS, ZnTe, SiC`]]},
{t:'sec',h:[`Structures with unequal charges or two cations`,`بنى بشحنات غير متساوية أو بكاتيونين`],u:[
[`<b>A<sub>m</sub>X<sub>p</sub> type, fluorite (CaF₂):</b> r<sub>C</sub>/r<sub>A</sub> ≈ 0.8, so coordination number 8. Ca²⁺ at cube centers, F⁻ at corners. Only half as many Ca²⁺ as F⁻, so it resembles CsCl with only half the cube centers occupied. One unit cell is eight cubes. Also ZrO₂, UO₂, PuO₂, ThO₂.`,`<b>النوع A<sub>m</sub>X<sub>p</sub>، الفلوريت (CaF₂):</b> r<sub>C</sub>/r<sub>A</sub> ≈ 0.8 لذا عدد التنسيق 8. أيونات Ca²⁺ في مراكز المكعبات وF⁻ في الأركان. عدد Ca²⁺ نصف عدد F⁻، فتشبه CsCl مع إشغال نصف مراكز المكعبات فقط. الخلية الوحدة ثمانية مكعبات. وتتخذها أيضاً ZrO₂ وUO₂ وPuO₂ وThO₂.`],
[`<b>A<sub>m</sub>B<sub>n</sub>X<sub>p</sub> type, perovskite (BaTiO₃):</b> two cation types. Ba²⁺ at all eight cube corners, one Ti⁴⁺ at the cube center, and O²⁻ at the center of each of the six faces.`,`<b>النوع A<sub>m</sub>B<sub>n</sub>X<sub>p</sub>، البيروفسكايت (BaTiO₃):</b> نوعان من الكاتيونات. Ba²⁺ في الأركان الثمانية وTi⁴⁺ واحد في مركز المكعب وO²⁻ في مركز كل وجه من الأوجه الستة.`]]},

W.perov=()=>{const id=uid();
  const I=[[`Ba²⁺`,`corners`,`الأركان`,8,1/8,`8 × 1/8`],[`Ti⁴⁺`,`cube center`,`مركز المكعب`,1,1,`1 × 1`],[`O²⁻`,`face centers`,`مراكز الأوجه`,6,1/2,`6 × 1/2`]];
  inits.push(()=>{const r=$id(id),q=s=>r.querySelector(s);const on=[true,false,false];
    const draw=()=>{let tot=on.map((o,i)=>o?I[i][3]*I[i][4]:0);
      r.querySelectorAll('.chip').forEach((b,i)=>b.setAttribute('aria-pressed',on[i]));
      q('.o').innerHTML=I.map((x,i)=>on[i]?`<div class="kv"><span>${x[0]} ${t([x[1],x[2]])}: ${x[5]}</span><b>${tot[i]}</b></div>`:'').join('')+
       (on.every(Boolean)?`<div class="note">${bi([`Per unit cell: 1 Ba, 1 Ti, 3 O, so the formula is <b>BaTiO₃</b>.`,`في الخلية الوحدة: 1 Ba و1 Ti و3 O، فتكون الصيغة <b>BaTiO₃</b>.`])}</div>`:`<p class="leg">${t([`Turn on all three ions to see the formula.`,`فعّل الأيونات الثلاثة لترى الصيغة.`])}</p>`)};
    r.querySelectorAll('.chip').forEach((b,i)=>b.onclick=()=>{on[i]=!on[i];draw()});draw()});
  return wcard([`Count the atoms in a perovskite cell`,`عدّ الذرات في خلية البيروفسكايت`],`<div class="row" style="margin-bottom:10px">${I.map(x=>`<button class="chip">${x[0]}</button>`).join('')}</div><div class="out o"></div><p class="leg">${t([`A corner atom is shared by 8 cells, a face atom by 2, a center atom by none.`,`ذرة الركن مشتركة بين 8 خلايا، وذرة الوجه بين خليتين، وذرة المركز لا تُشارَك.`])}</p>`,id)};

D[5]={title:[`Bioceramics Classification`,`تصنيف السيراميك الحيوي`],src:`Bioceramics Classification`,blocks:[
{t:'sec',h:[`Why ceramics can talk to bone`,`لماذا يتفاعل السيراميك مع العظم`],p:[
[`The inorganic mineral phase of bone is mainly a calcium phosphate similar to hydroxyapatite, so some bioceramics interact favorably with natural bone and support bone regeneration.`,`الطور المعدني غير العضوي في العظم هو أساساً فوسفات كالسيوم شبيه بالهيدروكسي أباتايت، لذا تتفاعل بعض السيراميكات الحيوية جيداً مع العظم الطبيعي وتدعم تجدده.`],
[`<b>Bioceramics</b> are ceramics used to repair and replace diseased or damaged skeletal tissue and to augment hard and soft tissue.`,`<b>السيراميكات الحيوية</b> سيراميكات تُستخدم لإصلاح واستبدال النسيج الهيكلي المصاب أو التالف ولتعزيز الأنسجة الصلبة والرخوة.`]]},
{t:'w',k:'bone'},
{t:'table',h:[`Three categories`,`ثلاث فئات`],cols:[[`Category`,`الفئة`],[`Behavior in the body`,`السلوك في الجسم`],[`Examples`,`أمثلة`]],rows:[
[[`Bioinert`,`خاملة حيوياً`],[`Minimal interaction with surrounding tissue`,`تفاعل ضئيل مع النسيج المحيط`],[`Alumina, zirconia`,`الألومينا والزركونيا`]],
[[`Bioactive`,`نشطة حيوياً`],[`Bond with tissue at the interface`,`ترتبط بالنسيج عند السطح البيني`],[`Calcium phosphate (HA), bioglasses`,`فوسفات الكالسيوم (HA) والزجاج الحيوي`]],
[[`Bioresorbable`,`قابلة للامتصاص حيوياً`],[`Degrade and are replaced by host tissue`,`تتحلل ويحل محلها نسيج المضيف`],[`Tricalcium phosphate`,`فوسفات الكالسيوم الثلاثي`]]]},
{t:'sec',h:[`Bioinert ceramics: zirconia`,`السيراميك الخامل: الزركونيا`],p:[
[`Alumina, zirconia, silica and titania are the first-generation ceramics, widely used for their excellent mechanical properties.`,`الألومينا والزركونيا والسيليكا والتيتانيا هي سيراميكات الجيل الأول، وتُستخدم على نطاق واسع لخواصها الميكانيكية الممتازة.`],
[`Pure zirconia comes from chemical conversion of zircon (ZrSiO₄). It is naturally monoclinic and, with rising temperature, becomes tetragonal and then cubic. Advantages: transformation toughening, low thermal conductivity, abrasion resistance and desirable biocompatibility; used in bulk or as a coating.`,`يُحصل على الزركونيا النقية بتحويل كيميائي للزركون (ZrSiO₄). وهي أحادية الميل في الطبيعة، ومع ارتفاع الحرارة تصبح رباعية ثم مكعبة. ومزاياها: التقسية بالتحول وانخفاض التوصيل الحراري ومقاومة البلى والتوافق الحيوي المرغوب؛ وتُستخدم كتلة صلبة أو طلاءً.`],
[`Pure zirconia suffers destructive volume changes (about 3–5%) and cracking when it changes phase on heating and cooling. <b>Partially stabilized zirconia (PSZ)</b> adds small amounts of yttria (Y₂O₃), magnesia (MgO) or calcia (CaO), which freeze a metastable tetragonal structure at room temperature.`,`تعاني الزركونيا النقية من تغيرات حجمية مدمّرة (نحو 3–5%) وتشققات عند تغير الطور بالتسخين والتبريد. أما <b>الزركونيا المثبّتة جزئياً (PSZ)</b> فتُضاف إليها كميات صغيرة من الإيتريا (Y₂O₃) أو المغنيسيا (MgO) أو الكالسيا (CaO) فتثبّت بنية رباعية شبه مستقرة عند حرارة الغرفة.`],
[`Zirconia has higher flexural strength and fracture toughness than other ceramics, so it resists chewing forces in precisely fitted crowns. Zirconia implants have shown less bacterial accumulation and a lower rate of inflammation-related processes than titanium.`,`للزركونيا مقاومة انحناء وصلابة كسر أعلى من السيراميكات الأخرى، فتقاوم قوى المضغ في التيجان الدقيقة الملاءمة. وقد أظهرت غرسات الزركونيا تراكماً أقل للبكتيريا ومعدلاً أقل للعمليات المرتبطة بالالتهاب مقارنةً بالتيتانيوم.`]]},
{t:'w',k:'tough'},
{t:'w',k:'v3d',set:'zirconia'},
{t:'sec',h:[`Bioinert ceramics: alumina and ZTA`,`السيراميك الخامل: الألومينا وZTA`],p:[
[`High-purity alumina comes from bauxite and native corundum; common α-alumina is made by calcining alumina trihydrate. ASTM requires implant alumina to contain <b>99.5% Al₂O₃</b> and <b>less than 0.1% SiO₂</b>.`,`تأتي الألومينا عالية النقاوة من البوكسيت والكوروندوم الطبيعي، وتُحضَّر ألومينا α الشائعة بتكليس ثلاثي هيدرات الألومينا. وتشترط ASTM أن تحوي ألومينا الغرسات <b>99.5% Al₂O₃</b> و<b>أقل من 0.1% SiO₂</b>.`],
[`The host isolates it with a thin, non-adherent fibrous capsule. It does not chemically bond to bone, so stability relies on mechanical fixation (press-fitting or interlocking porous networks).`,`يعزلها المضيف بكبسولة ليفية رقيقة غير ملتصقة. ولا ترتبط كيميائياً بالعظم، لذا يعتمد الثبات على التثبيت الميكانيكي (الضغط أو الشبكات المسامية المتشابكة).`],
[`Alumina femoral heads paired with ceramic or polyethylene liners greatly reduce wear in hip sockets and extend implant life.`,`رؤوس عظم الفخذ من الألومينا مع بطانات سيراميك أو بولي إيثيلين تقلل البلى في تجويف الورك كثيراً وتطيل عمر الغرسة.`],
[`<b>ZTA (zirconia-toughened alumina)</b> blends the hardness of alumina with the fracture toughness of zirconia. When a microscopic crack starts, the surrounding zirconia particles transform from tetragonal to monoclinic and trigger the toughening mechanism, arresting the crack. It is used for femoral heads in total hip replacement.`,`<b>ZTA (الألومينا المقواة بالزركونيا)</b> تجمع صلادة الألومينا وصلابة كسر الزركونيا. عند بدء شق مجهري تتحول جسيمات الزركونيا المحيطة من رباعية إلى أحادية الميل وتُفعّل آلية التقسية فتوقف الشق. وتُستخدم لرؤوس عظم الفخذ في استبدال مفصل الورك الكامل.`]]},
{t:'sec',h:[`Bioactive ceramics and Hench's bioglass`,`السيراميك النشط حيوياً وزجاج هينش الحيوي`],p:[
[`A bioactive material elicits a specific biological response at its interface that results in a bond between tissue and material. Per Hench, these show bioactivity to varying degrees: 45S5, KGS Ceravital, 55S4.3 Bioglass, A-W GC, HA, KGX Ceravital. 45S5 and 55S4.3 were named by Hench and contain SiO₂, CaO, Na₂O and P₂O₅ in specific proportions.`,`المادة النشطة حيوياً تثير استجابة حيوية محددة عند سطحها البيني ينتج عنها ارتباط بين النسيج والمادة. وبحسب هينش تُظهر المواد التالية نشاطاً حيوياً بدرجات متفاوتة: 45S5 وKGS Ceravital و55S4.3 Bioglass وA-W GC وHA وKGX Ceravital. والاسمان 45S5 و55S4.3 من تسمية هينش وفيهما SiO₂ وCaO وNa₂O وP₂O₅ بنسب محددة.`],
[`Larry Hench's idea was to combine the elements the body is rich in, in proportions that favor Ca- and P-rich surface layers. The base is Na₂O–CaO–SiO₂ with a small fixed P₂O₅ of <b>6 wt.%</b>, which speeds formation of hydroxyapatite and hydroxy-carbonate apatite layers.`,`كانت فكرة لاري هينش أن يجمع العناصر الوفيرة في الجسم بنسب تُسهّل تكوّن طبقات غنية بالكالسيوم والفوسفور. الأساس هو Na₂O–CaO–SiO₂ مع P₂O₅ ثابت وصغير بنسبة <b>6% وزنية</b> يسرّع تكوّن طبقات الهيدروكسي أباتايت والأباتايت الهيدروكسي كربوناتي.`]]},
{t:'tabs',h:[`Bioglass vs. window glass`,`الزجاج الحيوي مقابل زجاج النوافذ`],items:[
{n:[`Compare`,`مقارنة`],p:[[`Na₂O–CaO–SiO₂ is also the base of soda-lime silicate glass (windows, bottles, containers). Bioactive glasses differ in three ways, which make the surface highly reactive in an aqueous medium:`,`النظام Na₂O–CaO–SiO₂ هو أيضاً أساس زجاج الصودا والجير (النوافذ والزجاجات والأوعية). وتختلف الزجاجات النشطة حيوياً بثلاثة أمور تجعل سطحها شديد التفاعل في الوسط المائي:`]],u:[[`SiO₂ content below 60 mol%`,`محتوى SiO₂ أقل من 60 مول%`],[`High Na₂O and high CaO content`,`محتوى Na₂O وCaO عالٍ`],[`High CaO/P₂O₅ ratio`,`نسبة CaO/P₂O₅ عالية`]]}]},
{t:'w',k:'regions'},
{t:'sec',h:[`Hydroxyapatite (HA) and calcium phosphates`,`الهيدروكسي أباتايت وفوسفات الكالسيوم`],u:[
[`Calcium phosphates (CaP) are widely used in orthopedics and dentistry because they resemble bone mineral. The most common are <b>HA (Ca/P = 1.67)</b> and <b>β-TCP (Ca/P = 1.5)</b>. If Ca/P is below 1 the ceramic is very soluble and cannot be used for implantation.`,`تُستخدم فوسفات الكالسيوم (CaP) على نطاق واسع في جراحة العظام والأسنان لشبهها بمعدن العظم. أشهرها <b>HA (Ca/P = 1.67)</b> و<b>β-TCP (Ca/P = 1.5)</b>. وإذا كانت Ca/P أقل من 1 فالسيراميك شديد الذوبان ولا يصلح للغرس.`],
[`HA, Ca₁₀(PO₄)₆(OH)₂, is the main mineral of teeth and bone. It is osteoconductive, has a controlled degradation rate and bonds chemically to form new bone.`,`HA وصيغته Ca₁₀(PO₄)₆(OH)₂ هو المعدن الرئيسي للأسنان والعظام. وهو موصِّل للعظم ومعدل تحلله متحكم به ويرتبط كيميائياً ليكوّن عظماً جديداً.`],
[`Natural HA comes from corals or bovine bone and is not pure (trace Mg, Sr, CO₃…). Synthetic HA is made by direct precipitation, hydrothermal techniques, hydrolysis of other CaP, or solid-state reaction.`,`يُستخلص HA الطبيعي من المرجان أو عظم البقر وهو غير نقي (آثار Mg وSr وCO₃…). ويُصنَّع HA الصناعي بالترسيب المباشر أو التقنيات المائية الحرارية أو التحلل المائي لفوسفات كالسيوم أخرى أو التفاعل في الحالة الصلبة.`]]},
{t:'w',k:'cap'},
{t:'sec',h:[`Bioresorbable ceramics`,`السيراميك القابل للامتصاص`],p:[
[`These are designed for a temporary function, then degrade and are absorbed or eliminated naturally, which removes the need for a second surgery to remove the implant. Degradation products are metabolized or excreted while host tissue heals and replaces the material. Examples: magnesium (metal), polylactic acid (PLA) and polyglycolic acid (PGA) (polymers).`,`صُمّمت لأداء وظيفة مؤقتة ثم تتحلل ويمتصها الجسم أو يتخلص منها طبيعياً، وهذا يلغي الحاجة إلى جراحة ثانية لإزالة الغرسة. تُستقلب نواتج التحلل أو تُطرح بينما يلتئم نسيج المضيف ويحل محل المادة. أمثلتها: المغنيسيوم (معدن) وحمض البولي لاكتيك PLA وحمض البولي غليكوليك PGA (بوليمرات).`],
[`<b>Tricalcium phosphate (TCP), Ca₃(PO₄)₂</b>, is a biodegradable bioceramic, soluble in media, used as a degradable bone graft, with superior osteoconductivity, cell adhesion and mediation of accelerated differentiation. <b>β-TCP</b> is more soluble than HA, is gradually absorbed and replaced by natural bone, and is processed like HA.`,`<b>فوسفات الكالسيوم الثلاثي (TCP)، Ca₃(PO₄)₂</b>، سيراميك حيوي قابل للتحلل ويذوب في الأوساط، ويُستخدم طعماً عظمياً قابلاً للتحلل، وله توصيل عظمي متفوق والتصاق خلوي وتوسط في تسريع التمايز. و<b>β-TCP</b> أكثر ذوباناً من HA ويُمتص تدريجياً ويحل محله عظم طبيعي، ويُعالج بطرق مشابهة لـ HA.`]]},
{t:'w',k:'sort'}],
cards:[
[`Three bioceramic classes`,`ثلاث فئات للسيراميك الحيوي`,`Bioinert (alumina, zirconia), bioactive (CaP, bioglasses), bioresorbable (TCP).`,`خاملة (ألومينا وزركونيا) ونشطة (فوسفات الكالسيوم والزجاج الحيوي) وقابلة للامتصاص (TCP).`],
[`Bone composition`,`تركيب العظم`,`60–70% inorganic calcium phosphates, 20–30% organic (collagen), < 10% water and other.`,`60–70% فوسفات كالسيوم غير عضوية، 20–30% عضوي (كولاجين)، أقل من 10% ماء وغيره.`],
[`PSZ`,`PSZ`,`Zirconia with Y₂O₃, MgO or CaO that freezes metastable tetragonal at room temperature.`,`زركونيا مع Y₂O₃ أو MgO أو CaO تثبّت الطور الرباعي شبه المستقر عند حرارة الغرفة.`],
[`Transformation toughening`,`التقسية بالتحول`,`Stress at a crack turns tetragonal grains monoclinic; local expansion squeezes the crack shut.`,`الإجهاد عند الشق يحوّل الحبيبات الرباعية إلى أحادية الميل؛ والتمدد المحلي يغلق الشق.`],
[`Implant alumina (ASTM)`,`ألومينا الغرسات (ASTM)`,`≥ 99.5% Al₂O₃ and < 0.1% SiO₂; fibrous capsule, mechanical fixation.`,`≥ 99.5% Al₂O₃ و< 0.1% SiO₂؛ كبسولة ليفية وتثبيت ميكانيكي.`],
[`ZTA`,`ZTA`,`Alumina hardness plus zirconia toughness; used for femoral heads.`,`صلادة الألومينا مع صلابة الزركونيا؛ تُستخدم لرؤوس عظم الفخذ.`],
[`Bioglass 45S5`,`الزجاج الحيوي 45S5`,`Na₂O–CaO–SiO₂–P₂O₅ (6 wt% P₂O₅); bonds to bone so strongly it cannot be removed without destroying it.`,`Na₂O–CaO–SiO₂–P₂O₅ (6% وزنية P₂O₅)؛ يرتبط بالعظم بقوة بحيث لا يمكن نزعه دون تدميره.`],
[`Hydroxyapatite`,`الهيدروكسي أباتايت`,`Ca₁₀(PO₄)₆(OH)₂, Ca/P = 1.67; osteoconductive; main mineral of bone and teeth.`,`Ca₁₀(PO₄)₆(OH)₂ مع Ca/P = 1.67؛ موصِّل للعظم؛ المعدن الرئيسي للعظام والأسنان.`],
[`β-TCP`,`β-TCP`,`Ca₃(PO₄)₂, Ca/P = 1.5; more soluble than HA; resorbed and replaced by bone.`,`Ca₃(PO₄)₂ مع Ca/P = 1.5؛ أكثر ذوباناً من HA؛ يُمتص ويحل محله عظم.`]],
quiz:[
{q:[`Which is a bioinert ceramic?`,`أي مما يلي سيراميك خامل حيوياً؟`],o:[[`Alumina`,`الألومينا`],[`Hydroxyapatite`,`الهيدروكسي أباتايت`],[`β-TCP`,`β-TCP`],[`Bioglass 45S5`,`الزجاج الحيوي 45S5`]],a:0,e:[`Alumina and zirconia are the bioinert examples.`,`الألومينا والزركونيا هما مثالا السيراميك الخامل.`]},
{q:[`In partially stabilized zirconia, a crack triggers a change from:`,`في الزركونيا المثبتة جزئياً يؤدي الشق إلى تحول من:`],o:[[`Monoclinic to cubic`,`أحادية الميل إلى مكعبة`],[`Metastable tetragonal to monoclinic`,`رباعية شبه مستقرة إلى أحادية الميل`],[`Cubic to tetragonal`,`مكعبة إلى رباعية`],[`Amorphous to crystalline`,`غير متبلورة إلى بلورية`]],a:1,e:[`The expansion squeezes the crack shut.`,`التمدد يضغط الشق فيُغلق.`]},
{q:[`What does the host body form around an alumina implant?`,`ماذا يكوّن الجسم حول غرسة الألومينا؟`],o:[[`A chemical bond with bone`,`ارتباطاً كيميائياً بالعظم`],[`A thin non-adherent fibrous capsule`,`كبسولة ليفية رقيقة غير ملتصقة`],[`A hydroxyapatite layer`,`طبقة هيدروكسي أباتايت`],[`Nothing; it dissolves`,`لا شيء؛ إذ تذوب`]],a:1,e:[`Hence stability depends on mechanical fixation.`,`لذا يعتمد الثبات على التثبيت الميكانيكي.`]},
{q:[`The Ca/P ratio of hydroxyapatite is:`,`نسبة Ca/P في الهيدروكسي أباتايت هي:`],o:[[`1.0`,`1.0`],[`1.5`,`1.5`],[`1.67`,`1.67`],[`2.0`,`2.0`]],a:2,e:[`10 Ca / 6 P = 1.67; β-TCP is 1.5.`,`10 Ca / 6 P = 1.67، أما β-TCP فتساوي 1.5.`]},
{q:[`Class A bioactive glasses (area 1) are:`,`الزجاجات النشطة من الصنف A (المنطقة 1) هي:`],o:[[`Osteoproductive: bind bone and soft tissue`,`منتجة للعظم: ترتبط بالعظم والنسيج الرخو`],[`Fully resorbed in 10–30 days`,`تُمتص كلياً في 10–30 يوماً`],[`Bioinert`,`خاملة حيوياً`],[`Unable to form glass`,`لا تشكّل زجاجاً`]],a:0,e:[`Class B (area 2) are osteoconductive and bind only to bone.`,`الصنف B (المنطقة 2) موصِّل للعظم ويرتبط بالعظم فقط.`]},
{q:[`Which feature differs in bioactive glass compared with window glass?`,`أي ميزة تختلف في الزجاج الحيوي عن زجاج النوافذ؟`],o:[[`SiO₂ above 60 mol%`,`SiO₂ فوق 60 مول%`],[`Low Na₂O and CaO`,`Na₂O وCaO منخفضان`],[`High CaO/P₂O₅ ratio`,`نسبة CaO/P₂O₅ عالية`],[`No phosphorus anywhere`,`لا فوسفور إطلاقاً`]],a:2,e:[`Also SiO₂ below 60 mol% and high Na₂O and CaO.`,`وأيضاً SiO₂ أقل من 60 مول% وNa₂O وCaO عاليان.`]},
{q:[`Which material is designed to be absorbed so a second removal surgery is not needed?`,`أي مادة صُمّمت لتُمتص بحيث لا حاجة إلى جراحة ثانية لإزالتها؟`],o:[[`Zirconia`,`الزركونيا`],[`β-TCP`,`β-TCP`],[`316L steel`,`فولاذ 316L`],[`Alumina`,`الألومينا`]],a:1,e:[`β-TCP is gradually absorbed and replaced by natural bone.`,`يُمتص β-TCP تدريجياً ويحل محله عظم طبيعي.`]},
{q:[`The fixed P₂O₅ content in the Na₂O–CaO–SiO₂–P₂O₅ diagram is:`,`محتوى P₂O₅ الثابت في مخطط Na₂O–CaO–SiO₂–P₂O₅ هو:`],o:[[`2 wt%`,`2% وزنية`],[`6 wt%`,`6% وزنية`],[`20 wt%`,`20% وزنية`],[`45 wt%`,`45% وزنية`]],a:1,e:[`It accelerates formation of the HA layer.`,`وهو يسرّع تكوّن طبقة HA.`]}]};

W.regions=()=>{const id=uid();
  const R=[[`1 (red)`,`1 (أحمر)`,`Class A bioactive: osteoproductive, bonds to bone and soft tissue and activates genes. HA layer appears within several hours. Bioglass 45S5 is here: it bonds so strongly that the implant cannot be removed without destroying it.`,`نشط حيوياً صنف A: منتج للعظم يرتبط بالعظم والنسيج الرخو وينشّط الجينات. تظهر طبقة HA خلال ساعات. ينتمي الزجاج 45S5 إلى هذه المنطقة: فارتباطه قوي بحيث لا يمكن نزع الغرسة دون تدميرها.`],
   [`2 (green)`,`2 (أخضر)`,`Class B: osteoconductive, bonds only to bone. HA layer forms 24 to 96 h after integration.`,`الصنف B: موصِّل للعظم يرتبط بالعظم فقط. تتكوّن طبقة HA بعد 24 إلى 96 ساعة من الاندماج.`],
   [`3 (orange)`,`3 (برتقالي)`,`Cerabone-type bioglass ceramics: apatite crystals Ca₁₀(PO₄)₆(OH,F)₂ and wollastonite (CaO·SiO₂) in a residual SiO₂ glassy matrix. Here P₂O₅ content may vary.`,`زجاج سيراميكي حيوي من نوع Cerabone: بلورات أباتايت Ca₁₀(PO₄)₆(OH,F)₂ وولاستونايت (CaO·SiO₂) في أساس زجاجي من SiO₂ المتبقي. وهنا قد يتغير محتوى P₂O₅.`],
   [`4 (purple)`,`4 (بنفسجي)`,`Fully resorbed in the body within 10 to 30 days, with minimal restoration of damaged bone.`,`تُمتص كلياً في الجسم خلال 10 إلى 30 يوماً مع ترميم ضئيل للعظم التالف.`],
   [`5 (gray)`,`5 (رمادي)`,`Does not bond even to bone; behaves like a bioinert material.`,`لا ترتبط حتى بالعظم؛ وتسلك سلوك مادة خاملة حيوياً.`],
   [`6 (white)`,`6 (أبيض)`,`Glass formation is not observed.`,`لا يتكوّن زجاج.`]];
  inits.push(()=>{const r=$id(id),btns=r.querySelectorAll('.tb'),pan=r.querySelector('.tp');
    const show=k=>{btns.forEach((x,n)=>x.setAttribute('aria-selected',n===k));pan.innerHTML=bi([R[k][2],R[k][3]])};btns.forEach((x,n)=>x.onclick=()=>show(n));show(0)});
  return `<section class="card" id="${id}"><h2 class="ch">${t([`Reading the Na₂O–CaO–SiO₂ diagram (P₂O₅ fixed at 6 wt.%)`,`قراءة مخطط Na₂O–CaO–SiO₂ (P₂O₅ ثابت عند 6% وزنية)`])}</h2><div class="tbs">${R.map(x=>`<button class="tb">${t([x[0],x[1]])}</button>`).join('')}</div><div class="tp"></div><p class="leg">${t([`The six areas refer to the colored regions of Fig. 7-4 in the lecture.`,`المناطق الست تشير إلى المناطق الملونة في الشكل 7-4 في المحاضرة.`])}</p></section>`};
setLang(lang);
(function(){let i=0;const m=/^#l([1-6])$/.exec(location.hash);if(m)i=+m[1]-1;render(i)})();
</script>
