<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Biomaterials Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky bar (language + lecture tabs), then one lecture at a time as a stack of cards: concept sections, live widgets, flashcards, quiz. */
:root{
  --bg:#F1F5F9; --surface:#FFFFFF; --ink:#11212D; --muted:#566878; --line:#D3DDE6;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E3EBFC; --teal:#0A766F; --teal-soft:#DDF1EF;
  --ok:#17784A; --ok-soft:#DCF3E7; --bad:#B3261E; --bad-soft:#FBE3E1; --warn-soft:#FFF1D6;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif; --f-body:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif; --f-ar:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1721; --surface:#15222E; --ink:#E5ECF2; --muted:#94A6B5; --line:#273846;
  --accent:#7B9DFF; --accent-ink:#0D1721; --accent-soft:#1D2D52; --teal:#52C7BC; --teal-soft:#14343A;
  --ok:#4CC38A; --ok-soft:#133526; --bad:#FF8F86; --bad-soft:#3D1B19; --warn-soft:#3A2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1721; --surface:#15222E; --ink:#E5ECF2; --muted:#94A6B5; --line:#273846;
  --accent:#7B9DFF; --accent-ink:#0D1721; --accent-soft:#1D2D52; --teal:#52C7BC; --teal-soft:#14343A;
  --ok:#4CC38A; --ok-soft:#133526; --bad:#FF8F86; --bad-soft:#3D1B19; --warn-soft:#3A2F14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-head);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lt{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:thin}
.lt button{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;line-height:1.25;padding:7px 12px;border-radius:8px;cursor:pointer;text-align:start}
.lt button b{font-family:var(--f-head);font-size:15px;color:var(--accent)}
.lt button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lt .bd{font-size:11px;color:var(--ok);font-weight:600}
button:focus-visible,.nd:focus-visible,.op:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:22px;display:flex;flex-direction:column;gap:16px}
.lh{display:flex;gap:16px;align-items:center;padding:4px 0 6px}
.lh .num{font-family:var(--f-head);font-weight:700;font-size:44px;line-height:1;color:var(--accent);min-width:44px}
h1{font-family:var(--f-head);font-size:clamp(22px,4vw,30px);line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
.src{margin:4px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.ch{font-family:var(--f-head);font-size:17px;margin:0 0 10px;text-wrap:balance}
.sh{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;cursor:pointer;font-family:var(--f-head);font-weight:700;font-size:17px;line-height:1.3}
.sh:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sh i{flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.sh[aria-expanded="false"] i{transform:rotate(-45deg)}
.sh[aria-expanded="false"]+.sb{display:none}
.sb{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.bi{display:grid;gap:6px 28px;min-width:0}
.bi>*{margin:0;min-width:0;overflow-wrap:anywhere}
.ar{font-family:var(--f-ar);line-height:1.95}
body[data-lang="both"] .bi{grid-template-columns:1fr 1fr}
body[data-lang="both"] .bi .ar{color:var(--ink);border-inline-start:2px solid var(--teal-soft);padding-inline-start:12px}
body[data-lang="en"] .ar{display:none!important}
body[data-lang="ar"] .en{display:none!important}
.t{display:inline}
body[data-lang="both"] .t .ar{display:block;font-size:.92em;color:var(--teal)}
@media (max-width:860px){body[data-lang="both"] .bi{grid-template-columns:1fr}}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pts li{position:relative;padding-inline-start:16px}
.pts li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.note{background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:start;vertical-align:top}
th{font-family:var(--f-head);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500}
td{font-variant-numeric:tabular-nums}
.tbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tb,.btn,.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-align:start}
.tb[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb[aria-selected="true"] .ar,.chip[aria-pressed="true"] .ar{color:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tp{display:flex;flex-direction:column;gap:10px}
.wg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.wg{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.out{display:grid;gap:8px;align-content:start}
.kv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px;font-variant-numeric:tabular-nums}
.kv b{font-family:var(--f-head);font-size:17px;color:var(--accent);white-space:nowrap}
.big{font-family:var(--f-head);font-weight:700;font-size:34px;color:var(--accent)}
svg text{fill:var(--ink);font-family:var(--f-body);font-size:12px}
svg .ar{font-family:var(--f-ar)}
svg .ln{stroke:var(--muted);stroke-width:1.5;fill:none}
.nd{cursor:pointer}
.nd circle{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.nd.c circle{fill:var(--teal)}
.nd[aria-pressed="true"] circle{stroke:var(--ink)}
.svgbox{max-width:100%;overflow-x:auto}
.bar2{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar2 span{display:block;height:100%;transition:width .2s}
.bar3{position:relative;height:30px;display:flex;border-radius:6px;overflow:hidden;font-size:11px}
.bar3 span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.mk{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);transition:left .15s}
.dens{display:grid;gap:6px}
.dens .r{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.dens .r i{display:block;height:14px;border-radius:4px;background:var(--accent)}
.fc{perspective:900px}
.fcc{min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;font-size:17px;width:100%;color:var(--ink);font-family:inherit}
.fcc.back{background:var(--teal-soft)}
.fcc .t .ar{font-size:1em}
.ct{font-size:13px;color:var(--muted)}
.qn{font-size:12px;color:var(--muted);margin-bottom:6px}
.qq{font-weight:500;font-size:16px;margin-bottom:12px}
.qo{display:grid;gap:8px}
.op{font:inherit;text-align:start;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;cursor:pointer}
.op.ok{background:var(--ok-soft);border-color:var(--ok)}
.op.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.nav2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cmp{display:grid;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.leg{font-size:12px;color:var(--muted)}
.cr circle{fill:none;stroke:var(--accent);stroke-width:2;transition:all .5s}
.cr circle.m{fill:var(--teal);stroke:var(--teal);r:13px}
.cr .cw{fill:var(--bad);stroke:none}
.sq{stroke-width:4;fill:none;stroke:var(--line)}
.sq.on{stroke:var(--accent)}
body[data-lang="both"] .t .ar{text-align:left}
.fcc .t .ar,.seg .t .ar{text-align:center!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="top"><div class="top-in"><div class="bar"><div class="brand">Biomaterials Study Guide<small>Dr. Murtadha Alher &middot; 6 lectures &middot; English / العربية</small></div>
<div class="seg" id="lg" role="group" aria-label="Language"><button data-l="en" aria-pressed="false">English</button><button data-l="both" aria-pressed="true">EN + AR</button><button data-l="ar" aria-pressed="false">العربية</button></div></div>
<nav class="lt" id="lt" aria-label="Lectures"></nav></div></div>
<div class="wrap"><main id="main"></main></div>
<script>
const $id=id=>document.getElementById(id);
const t=p=>`<span class="t"><span class="en" lang="en">${p[0]}</span><span class="ar" lang="ar" dir="rtl">${p[1]}</span></span>`;
const bi=(p,tag='p')=>`<div class="bi"><${tag} class="en" lang="en">${p[0]}</${tag}><${tag} class="ar" lang="ar" dir="rtl">${p[1]}</${tag}></div>`;
let uidN=0;const uid=()=>'u'+(++uidN);
let inits=[];let lang='both',cur=0;const best={};
try{lang=localStorage.getItem('bm-lang')||'both'}catch(e){}
const D=[];

function sec(b){return `<section class="card"><button class="sh" aria-expanded="true">${t(b.h)}<i></i></button><div class="sb">${(b.p||[]).map(p=>bi(p)).join('')}${b.u?`<ul class="pts">${b.u.map(u=>`<li>${bi(u,'span')}</li>`).join('')}</ul>`:''}${b.note?`<div class="note">${bi(b.note)}</div>`:''}</div></section>`}

function tbl(b){const c=x=>typeof x==='string'?x:t(x);return `<section class="card">${b.h?`<h2 class="ch">${t(b.h)}</h2>`:''}<div class="tw"><table><thead><tr>${b.cols.map(x=>`<th>${c(x)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(x=>`<td>${c(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${b.note?`<div class="note" style="margin-top:10px">${bi(b.note)}</div>`:''}</section>`}

function tabs(b){const id=uid();
  inits.push(()=>{const r=$id(id),btns=r.querySelectorAll('.tb'),pan=r.querySelector('.tp');
    const show=k=>{btns.forEach((x,n)=>x.setAttribute('aria-selected',n===k));const it=b.items[k];
      pan.innerHTML=(it.p||[]).map(p=>bi(p)).join('')+(it.u?`<ul class="pts">${it.u.map(u=>`<li>${bi(u,'span')}</li>`).join('')}</ul>`:'')+(it.note?`<div class="note">${bi(it.note)}</div>`:'')};
    btns.forEach((x,n)=>x.onclick=()=>show(n));show(0)});
  return `<section class="card" id="${id}">${b.h?`<h2 class="ch">${t(b.h)}</h2>`:''}<div class="tbs" role="tablist">${b.items.map(it=>`<button class="tb" role="tab">${t(it.n)}</button>`).join('')}</div><div class="tp"></div></section>`}

function reveal(b){const id=uid();
  inits.push(()=>{const r=$id(id);r.querySelector('.btn').onclick=e=>{const o=r.querySelector('.rv');o.hidden=!o.hidden;e.currentTarget.setAttribute('aria-pressed',!o.hidden)};
    r.querySelector('.rv').innerHTML=b.run()});
  return `<section class="card" id="${id}"><h2 class="ch">${t(b.h)}</h2>${(b.p||[]).map(p=>bi(p)).join('')}<div class="row" style="margin-top:10px"><button class="btn pri">${t(['Show / hide solution','أظهر / أخفِ الحل'])}</button></div><div class="rv sb" hidden style="margin-top:12px"></div></section>`}

function block(b){
  if(b.t==='sec')return sec(b);if(b.t==='table')return tbl(b);if(b.t==='tabs')return tabs(b);if(b.t==='rev')return reveal(b);
  if(b.t==='w')return W[b.k](b);return ''}

function cardsHTML(i){return `<section class="card" id="fcs"><h2 class="ch">${t(['Flashcards: tap a card to flip','بطاقات المراجعة: اضغط على البطاقة لقلبها'])}</h2><div class="fc"><button class="fcc" id="fcc"></button></div><div class="row" style="margin-top:10px;align-items:center"><button class="btn" id="fp">${t(['Previous','السابق'])}</button><button class="btn" id="fn">${t(['Next','التالي'])}</button><span class="ct" id="fct"></span></div></section>`}
function initCards(i){const C=D[i].cards;let k=0,back=false;const el=$id('fcc');
  const draw=()=>{const c=C[k];el.className='fcc'+(back?' back':'');el.innerHTML=back?`<div>${bi([c[2],c[3]])}</div>`:`<div style="font-family:var(--f-head);font-weight:700">${t([c[0],c[1]])}</div>`;$id('fct').textContent=(k+1)+' / '+C.length};
  el.onclick=()=>{back=!back;draw()};$id('fp').onclick=()=>{k=(k+C.length-1)%C.length;back=false;draw()};$id('fn').onclick=()=>{k=(k+1)%C.length;back=false;draw()};draw()}

function quizHTML(i){return `<section class="card" id="quiz"><h2 class="ch">${t(['Quiz: check yourself','اختبر نفسك'])}</h2><div class="qb"></div></section>`}
function initQuiz(i){const Q=D[i].quiz;const root=$id('quiz').querySelector('.qb');let k=0,s=0;
  const draw=()=>{
    if(k>=Q.length){best[i]=Math.max(best[i]||0,s);updNav();
      root.innerHTML=`<div class="big">${s} / ${Q.length}</div>${bi(s===Q.length?['Perfect. You can move on to the next lecture.','ممتاز. يمكنك الانتقال إلى المحاضرة التالية.']:['Review the sections and flashcards above, then try again.','راجع الأقسام والبطاقات أعلاه ثم أعد المحاولة.'])}<div class="row" style="margin-top:12px"><button class="btn pri" id="qr">${t(['Try again','أعد المحاولة'])}</button></div>`;
      $id('qr').onclick=()=>{k=0;s=0;draw()};return}
    const q=Q[k];
    root.innerHTML=`<div class="qn">${k+1} / ${Q.length}</div><div class="qq">${bi(q.q)}</div><div class="qo">${q.o.map((o,n)=>`<button class="op" data-n="${n}">${t(o)}</button>`).join('')}</div><div class="fb" hidden></div>`;
    root.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;const ok=n===q.a;if(ok)s++;
      root.querySelectorAll('.op').forEach((x,m)=>{x.disabled=true;if(m===q.a)x.classList.add('ok');else if(m===n)x.classList.add('bad')});
      const fb=root.querySelector('.fb');fb.hidden=false;
      fb.innerHTML=`<div><b>${t(ok?['Correct.','إجابة صحيحة.']:['Not quite.','ليست صحيحة.'])}</b></div>${bi(q.e)}<div class="row"><button class="btn pri" id="qx">${t(k+1<Q.length?['Next question','السؤال التالي']:['See score','عرض النتيجة'])}</button></div>`;
      $id('qx').onclick=()=>{k++;draw()}});
  };draw()}

function navHTML(i){return `<div class="nav2">${i>0?`<button class="btn" data-go="${i-1}">&larr; ${t(['Previous lecture','المحاضرة السابقة'])}</button>`:'<span></span>'}${i<D.length-1?`<button class="btn pri" data-go="${i+1}">${t(['Next lecture','المحاضرة التالية'])} &rarr;</button>`:'<span></span>'}</div>`}

const SHORT=[['Introduction','المقدمة'],['Solid Structure','البنية الصلبة'],['Metallic','المعادن'],['Phase Diagrams','مخططات الأطوار'],['Ceramic Crystals','بلورات السيراميك'],['Bioceramics','السيراميك الحيوي']];
function updNav(){$id('lt').innerHTML=SHORT.map((s,n)=>`<button data-go="${n}" ${n===cur?'aria-current="true"':''}><b>${n+1}</b><span>${t(s)}${best[n]!=null?`<span class="bd"> ${best[n]}/${D[n].quiz.length}</span>`:''}</span></button>`).join('')}
function setLang(l){lang=l;document.body.dataset.lang=l;try{localStorage.setItem('bm-lang',l)}catch(e){}
  document.querySelectorAll('#lg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l))}

function render(i){cur=i;inits=[];const d=D[i];
  let h=`<header class="lh"><div class="num">${i+1}</div><div><h1>${t(d.title)}</h1><p class="src">${d.src} &middot; Dr. Murtadha Alher</p></div></header>`;
  d.blocks.forEach(b=>h+=block(b));h+=cardsHTML(i)+quizHTML(i)+navHTML(i);
  $id('main').innerHTML=h;inits.forEach(f=>f());initCards(i);initQuiz(i);updNav();
  try{history.replaceState(null,'','#l'+(i+1))}catch(e){}window.scrollTo(0,0)}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){render(+g.dataset.go);return}
  const s=e.target.closest('.sh');if(s)s.setAttribute('aria-expanded',s.getAttribute('aria-expanded')!=='true')});
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
const W={};
const wcard=(h,inner,id)=>`<section class="card" id="${id}"><h2 class="ch">${t(h)}</h2>${inner}</section>`;
const fld=(lbl,inp)=>`<label class="fld"><span>${t(lbl)}</span>${inp}</label>`;
const f2=(x,d=2)=>Number(x).toFixed(d);

/* L1: five components, clickable */
W.tetra=()=>{const id=uid();
  const N=[
   [`Structure`,`البنية`,`Arrangement of internal components: subatomic, atomic, microscopic, macroscopic.`,`ترتيب المكونات الداخلية: دون ذري وذري ومجهري وعياني.`],
   [`Properties`,`الخواص`,`Mechanical, electrical, thermal, magnetic, optical and deteriorative.`,`ميكانيكية وكهربائية وحرارية ومغناطيسية وضوئية وتدهورية.`],
   [`Processing`,`المعالجة`,`How the material is produced and shaped, for example casting, forging or heat treatment.`,`كيفية إنتاج المادة وتشكيلها، مثل السباكة والطرق والمعالجة الحرارية.`],
   [`Characterization`,`التوصيف`,`How structure and properties are measured, for example by X-ray diffraction.`,`كيفية قياس البنية والخواص، مثل حيود الأشعة السينية.`],
   [`Performance`,`الأداء`,`How the material behaves in service, for example inside the body.`,`سلوك المادة أثناء الخدمة، مثل داخل الجسم.`]];
  inits.push(()=>{const r=$id(id),out=r.querySelector('.od');

/* L4: Fe-C slow-cooled microstructure */

      else if(C<=2){pro=(C-0.76)/(6.70-0.76);pear=1-pro;proName=[`Proeutectoid cementite (Fe₃C)`,`سمنتيت أولي (Fe₃C)`];name=[`Hypereutectoid steel`,`فولاذ فوق يوتكتويدي`]}

       <div class="bar2" title="microconstituents"><span style="width:${pro*100}%;background:var(--teal)"></span><span style="width:${pear*100}%;background:var(--accent)"></span></div>
       <div class="kv"><span>${t([`Total α ferrite`,`مجموع الفريت α`])}</span><b>${f2(wa*100,1)}%</b></div><div class="kv"><span>${t([`Total Fe₃C`,`مجموع Fe₃C`])}</span><b>${f2(wc*100,1)}%</b></div>`};
    q('.c').oninput=calc;calc()});
  const inner=`<div class="wg"><div>${fld([`Carbon content C₀ (wt% C)`,`محتوى الكربون C₀ (% وزنية C)`],`<input class="c" type="range" min="0.05" max="2" step="0.01" value="0.38">`)}<p style="margin:4px 0">C₀ = <b class="cv">0.38</b> wt% C</p>
   <p class="leg">${t([`Slow cooling to just below 727 °C. Hypoeutectoid: proeutectoid α = (0.76 − C₀)/(0.76 − 0.022). Hypereutectoid: proeutectoid Fe₃C = (C₀ − 0.76)/(6.70 − 0.76). Total α = (6.70 − C₀)/(6.70 − 0.022). The bar shows proeutectoid phase (green) and pearlite (blue).`,`تبريد بطيء حتى ما دون 727 °م مباشرة. تحت اليوتكتويدي: α الأولي = (0.76 − C₀)/(0.76 − 0.022). فوق اليوتكتويدي: Fe₃C الأولي = (C₀ − 0.76)/(6.70 − 0.76). مجموع α = (6.70 − C₀)/(6.70 − 0.022). يعرض الشريط الطور الأولي (أخضر) والبيرلايت (أزرق).`])}</p></div><div class="out o"></div></div>`;

const CATN={corner:[`corners`,`أركان`,'1/8',1/8],edge:[`edges`,`أحرف`,'1/4',1/4],face:[`faces`,`أوجه`,'1/2',1/2],in:[`inside`,`داخل الخلية`,'1',1],hc:[`corners`,`أركان`,'1/6',1/6],hf:[`face centers`,`مراكز الأوجه`,'1/2',1/2],hi:[`inside`,`داخل الخلية`,'1',1]};
const catOf=a=>{if(a.k)return a.k;const n=a.p.filter(v=>Math.abs(Math.abs(v)-.5)<1e-6).length;return n===3?'corner':n===2?'edge':n===1?'face':'in'};
const D3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);

function build3D(cfg){
  const A=cfg.atoms;let d0=1e9;
  for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){if(cfg.mode==='cross'&&A[i].s===A[j].s)continue;const d=D3(A[i].p,A[j].p);if(d<d0)d0=d}
  const bonds=[];for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){if(cfg.mode==='cross'&&A[i].s===A[j].s)continue;if(D3(A[i].p,A[j].p)<=d0*1.03)bonds.push([i,j])}
  let fi=-1;if(cfg.focus){let best=1e9;A.forEach((a,i)=>{const d=D3(a.p,cfg.focus);if(d<best){best=d;fi=i}})}
  const nb=new Set();if(fi>=0)bonds.forEach(([i,j])=>{if(i===fi)nb.add(j);if(j===fi)nb.add(i)});
  return {bonds,fi,nb,d0}}

function tallyHTML(cfg){
  return cfg.sp.map((sp,si)=>{const g={};let tot=0;cfg.atoms.forEach(a=>{if(a.s!==si)return;const k=catOf(a);g[k]=(g[k]||0)+1;tot+=CATN[k][3]});
    const parts=Object.keys(g).map(k=>`${g[k]} ${t([CATN[k][0],CATN[k][1]])} × ${CATN[k][2]}`).join(' + ');
    return `<div class="kv"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${sp.col};margin-inline-end:6px"></i>${t(sp.n)}<br><span class="leg">${parts}</span></span><b>${Math.round(tot*100)/100}</b></div>`}).join('')}

W.v3d=(b)=>{const id=uid(),set=b.set,L=V3[set];

  inits.push(()=>{const r=$id(id),q=s=>r.querySelector(s),cv=q('canvas'),ctx=cv.getContext('2d');

    const tgt=()=>set==='zirconia'?cfg.par:{sy:1,sh:0,sc:1};
    const info=()=>{

      if(set==='zirconia'){q('.tl').innerHTML=tallyHTML(cfg);q('.mt').innerHTML='';q('.lg').innerHTML=cfg.sp.map(sp=>`<span class="ct" style="display:inline-flex;align-items:center;gap:5px;margin-inline-end:12px"><i style="width:10px;height:10px;border-radius:50%;background:${sp.col}"></i>${t(sp.n)}</span>`).join('');return}
      q('.tl').innerHTML=`<div class="ct">${t([`Atoms per unit cell`,`الذرات في الخلية الوحدة`])}</div>`+tallyHTML(cfg);
      const nbc=B.nb.size;
      q('.mt').innerHTML=`<div class="kv"><span>${t([`Coordination number`,`عدد التنسيق`])}</span><b>${cfg.cn}</b></div>`+(set==='metals'?`<div class="kv"><span>${t([`Atomic packing factor`,`معامل التعبئة الذري`])}</span><b>${cfg.apf}</b></div>`:'')+`<div class="kv"><span>${t([`Relation`,`العلاقة`])}</span><b style="font-size:14px">${t(cfg.rel)}</b></div><div class="kv"><span>${t([`Examples`,`أمثلة`])}</span><b style="font-size:14px;white-space:normal;text-align:end">${t(cfg.ex)}</b></div>`+(hl&&set==='metals'?`<p class="leg">${t([`Highlighted: ${nbc} neighbors inside this cell; the full lattice has ${cfg.cn}, because the other neighbors lie in adjacent cells.`,`المبرز: ${nbc} جيران داخل هذه الخلية؛ وفي الشبكة الكاملة ${cfg.cn} لأن بقية الجيران في خلايا مجاورة.`])}</p>`:hl?`<p class="leg">${t([`Highlighted: ${nbc} nearest neighbors of the selected ion.`,`المبرز: ${nbc} من أقرب الجيران للأيون المحدد.`])}</p>`:'');
      q('.lg').innerHTML=cfg.sp.map(sp=>`<span class="ct" style="display:inline-flex;align-items:center;gap:5px;margin-inline-end:12px"><i style="width:10px;height:10px;border-radius:50%;background:${sp.col}"></i>${t(sp.n)}</span>`).join('')};
    const proj=(p,w,h,S)=>{let [x,y,z]=p;const T=tgtCur;y=y*T.sy;x=(x+T.sh*y)*1;x*=T.sc;y*=T.sc;z*=T.sc;
      const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
      const x1=x*cy+z*sy,z1=-x*sy+z*cy,y2=y*cp-z1*sp,z2=y*sp+z1*cp,k=3.6/(3.6-z2);
      return {x:w/2+x1*k*S,y:h/2-y2*k*S,z:z2,k}};
    let tgtCur=cur;
    const col=(c,a)=>{const n=parseInt(c.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
    const draw=()=>{if(!cv.isConnected)return;
      const w=cv.clientWidth||400,h=340,dpr=window.devicePixelRatio||1;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      const tg=tgt();for(const k of ['sy','sh','sc'])cur[k]+=(tg[k]-cur[k])*.14;tgtCur=cur;
      if(auto&&!drag)yaw+=.006;
      const cs=getComputedStyle(cv),ink=cs.getPropertyValue('--ink').trim()||'#222';
      const S=Math.min(w,h)*.42/cfg.ext;const items=[];
      const P=cfg.atoms.map(a=>proj(a.p,w,h,S));
      cfg.edges.forEach(e=>{const a=proj(e[0],w,h,S),b2=proj(e[1],w,h,S);items.push({t:'e',a,b:b2,z:(a.z+b2.z)/2-.001})});
      if(bonds||hl)B.bonds.forEach(([i,j])=>{const on=!hl||i===B.fi||j===B.fi;if(!bonds&&!on)return;items.push({t:'b',a:P[i],b:P[j],z:(P[i].z+P[j].z)/2,on})});
      cfg.atoms.forEach((a,i)=>{const sp=cfg.sp[a.s];const inF=!hl||i===B.fi||B.nb.has(i);items.push({t:'a',p:P[i],z:P[i].z,r:sp.r*size*S*P[i].k,col:sp.col,dim:!inF,foc:hl&&i===B.fi})});
      items.sort((u,v)=>u.z-v.z);
      items.forEach(it=>{
        if(it.t==='e'){ctx.strokeStyle=ink;ctx.globalAlpha=hl?.25:.45;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(it.a.x,it.a.y);ctx.lineTo(it.b.x,it.b.y);ctx.stroke();ctx.globalAlpha=1}
        else if(it.t==='b'){ctx.strokeStyle=ink;ctx.globalAlpha=hl?(it.on?.9:.1):.55;ctx.lineWidth=hl&&it.on?3:1.8;ctx.beginPath();ctx.moveTo(it.a.x,it.a.y);ctx.lineTo(it.b.x,it.b.y);ctx.stroke();ctx.globalAlpha=1}
        else{ctx.globalAlpha=it.dim?.18:1;ctx.fillStyle=it.col;ctx.beginPath();ctx.arc(it.p.x,it.p.y,Math.max(2,it.r),0,6.2832);ctx.fill();
          const g=ctx.createRadialGradient(it.p.x-it.r*.35,it.p.y-it.r*.35,it.r*.05,it.p.x,it.p.y,it.r);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.6,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.25)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(it.p.x,it.p.y,Math.max(2,it.r),0,6.2832);ctx.fill();
          if(it.foc){ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(it.p.x,it.p.y,Math.max(2,it.r)+3,0,6.2832);ctx.stroke()}ctx.globalAlpha=1}});
      requestAnimationFrame(draw)};
    cv.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-lx)*.01;pitch=Math.max(-1.45,Math.min(1.45,pitch+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY};

    r.querySelectorAll('.tb').forEach((x,n)=>x.onclick=()=>sel(n));

    cb('.cbb',v=>bonds=v);if(q('.cbh'))cb('.cbh',v=>hl=v);cb('.cba',v=>auto=v);
    q('.sz').oninput=e=>{size=+e.target.value/100;q('.szv').textContent=e.target.value+'%'};
    q('.rs').onclick=()=>{yaw=-.65;pitch=.42};
    q('.cbb').checked=bonds;q('.cba').checked=auto;
    sel(0);requestAnimationFrame(draw)});
  const tabs=L.map(c=>`<button class="tb">${t(c.n)}</button>`).join('');
  const hlc=set==='zirconia'?'':`<label class="ct"><input type="checkbox" class="cbh"> ${t([`Highlight coordination`,`إبراز التنسيق`])}</label>`;
  return `<section class="card" id="${id}"><h2 class="ch">${t(titles[set])}</h2>${bi([`Drag the model to rotate it. Use the size slider to switch between small balls (to see the arrangement) and large hard spheres. Spheres are drawn schematically.`,`اسحب المجسم لتدويره. استعمل منزلق الحجم للتبديل بين كرات صغيرة (لرؤية الترتيب) وكرات صلبة كبيرة. الكرات مرسومة بشكل تخطيطي.`])}
   <div class="tbs" role="tablist" style="margin-top:10px">${tabs}</div>

/* ===== Classification game (L6) ===== */

  const IT=[[`Alumina`,`الألومينا`,0,`Fibrous capsule forms; no chemical bond to bone.`,`تتكوّن كبسولة ليفية؛ ولا ارتباط كيميائي بالعظم.`],
   [`Zirconia (PSZ)`,`الزركونيا (PSZ)`,0,`First-generation bioinert ceramic with transformation toughening.`,`سيراميك خامل من الجيل الأول مع تقسية بالتحول.`],

   [`Hydroxyapatite`,`الهيدروكسي أباتايت`,1,`Bonds chemically to bone; Ca/P = 1.67.`,`يرتبط كيميائياً بالعظم؛ Ca/P = 1.67.`],

/* ===== Cold working (L3) ===== */
W.cw=()=>{const id=uid();
  inits.push(()=>{const r=$id(id),q=s=>r.querySelector(s);
    const E=10,sy=1,sg=e=>e<=sy/E?E*e:sy+1.3*(1-Math.exp(-(e-sy/E)*7));

    const upd=()=>{const e2=+q('.e').value/100,s2=sg(e2),er=e2-s2/E;
      let c='';for(let k=0;k<=60;k++){const e=k/60*0.5;c+=(k?'L':'M')+X(e).toFixed(1)+' '+Y(sg(e)).toFixed(1)}
      let up=`M${X(e2)} ${Y(s2)} L${X(er)} ${Y(0)}`;
      q('.sv').innerHTML=`<line class="ln" x1="40" y1="190" x2="380" y2="190"/><line class="ln" x1="40" y1="190" x2="40" y2="14"/><text x="376" y="206" text-anchor="end">strain ε</text><text x="46" y="20">stress σ</text>
        <path d="${c}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="${up}" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 3"/>
        <path d="M${X(er)} ${Y(0)} L${X(e2)} ${Y(s2)}" fill="none" stroke="var(--teal)" stroke-width="2"/>
        <line x1="40" x2="${X(sy/E)}" y1="${Y(sy)}" y2="${Y(sy)}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="8" y="${Y(sy)+4}">σy</text>
        <line x1="40" x2="${X(e2)}" y1="${Y(s2)}" y2="${Y(s2)}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="8" y="${Y(s2)+4}">σ'y</text>
        <circle cx="${X(e2)}" cy="${Y(s2)}" r="5" fill="var(--teal)"/><circle cx="${X(er)}" cy="${Y(0)}" r="4" fill="var(--bad)"/><text x="${X(er)}" y="206" text-anchor="middle" style="fill:var(--bad)">residual</text>`;
      q('.o').innerHTML=`<div class="kv"><span>${t([`Original yield strength σy`,`إجهاد الخضوع الأصلي σy`])}</span><b>${sy.toFixed(2)}</b></div><div class="kv"><span>${t([`New yield strength σ'y`,`إجهاد الخضوع الجديد σ'y`])}</span><b>${s2.toFixed(2)}</b></div><div class="kv"><span>${t([`Increase`,`الزيادة`])}</span><b>+${((s2/sy-1)*100).toFixed(0)}%</b></div><div class="kv"><span>${t([`Permanent set (residual strain)`,`الانفعال الدائم (المتبقي)`])}</span><b>${er.toFixed(3)}</b></div>`};
    q('.e').oninput=upd;upd()});
  return wcard([`Cold working: load past yield, unload, reload`,`التشغيل على البارد: تحميل بعد الخضوع ثم إزالة الحمل ثم إعادة التحميل`],`<div class="wg"><div>${fld([`Strain at which you unload`,`الانفعال الذي تزيل عنده الحمل`],`<input class="e" type="range" min="12" max="48" value="30">`)}<div class="svgbox"><svg class="sv" viewBox="0 0 390 216" width="100%" style="max-width:420px"></svg></div></div><div class="out o"></div></div>
   <p class="leg">${t([`Schematic curve in arbitrary units. Blue: loading. Red dashed: unloading along the elastic slope. Green: reloading, which now yields at σ'y, the stress where you unloaded. The yield strength rose because plastic deformation raised the dislocation density.`,`منحنى تخطيطي بوحدات اعتباطية. الأزرق: التحميل. الأحمر المتقطع: إزالة الحمل بميل المرونة. الأخضر: إعادة التحميل ويخضع الآن عند σ'y وهو الإجهاد الذي أزلت عنده الحمل. ارتفع إجهاد الخضوع لأن التشوه اللدن رفع كثافة الانخلاعات.`])}</p>`,id)};

/* ===== Bond types (L2) ===== */
W.bonds=()=>{const id=uid();
  const dots=(n,seed)=>{let s='';for(let i=0;i<n;i++){const a=(i*137.5+seed)%360,rr=(i*53%90)/90;s+=`<circle cx="${40+((i*67+seed)%220)}" cy="${18+((i*41+seed*3)%84)}" r="2.2" fill="${ORGB}"/>`}return s};

  const BT=[[`Ionic`,`أيونية`,'ion',[`A metal gives valence electrons to a nonmetal and both become ions that attract each other. Nondirectional. 600–1500 kJ/mol, high melting points. NaCl and other metal–nonmetal compounds.`,`يعطي الفلز إلكترونات التكافؤ للافلز فيصبح الاثنان أيونين يتجاذبان. غير اتجاهية. 600–1500 kJ/mol ودرجات انصهار عالية. NaCl ومركبات الفلز واللافلز.`]],
   [`Covalent`,`تساهمية`,'cov',[`Neighboring atoms share electrons. Directional: acts only between the sharing atoms. H₂, CH₄, H₂O, diamond, Si, GaAs, SiC and polymer chains.`,`تتشارك الذرات المتجاورة الإلكترونات. اتجاهية: تعمل بين الذرات المتشاركة فقط. H₂ وCH₄ وH₂O والألماس وSi وGaAs وSiC وسلاسل البوليمر.`]],
   [`Metallic`,`فلزية`,'met',[`Positive ion cores held together by a sea of free valence electrons. Nondirectional, so ions can shift without breaking the crystal (plastic deformation). Melting from −39 to 3410 °C.`,`أيونات موجبة يمسك بها بحر من إلكترونات التكافؤ الحرة. غير اتجاهية، لذا يمكن للأيونات الانزلاق دون تحطيم البلورة (تشوه لدن). الانصهار من −39 إلى 3410 °م.`]],
   [`Van der Waals`,`فان در فالس`,'vdw',[`Weak attraction between dipoles, fluctuating induced or permanent. About 10 kJ/mol.`,`تجاذب ضعيف بين ثنائيات القطب، المستحثة المتذبذبة أو الدائمة. نحو 10 kJ/mol.`]],
   [`Hydrogen bond`,`رابطة هيدروجينية`,'hb',[`H bonded to F, O or N is an unscreened proton that attracts the negative end of a neighboring molecule. The strongest secondary bond: up to 51 kJ/mol. HF, H₂O, NH₃.`,`الهيدروجين المرتبط بـ F أو O أو N بروتون غير محجوب يجذب الطرف السالب لجزيء مجاور. أقوى الروابط الثانوية: حتى 51 kJ/mol. HF وH₂O وNH₃.`]]];

D[0]={title:[`Introduction to Materials and Biomaterials`,`مقدمة في المواد والمواد الحيوية`],src:`Ch1: Introduction`,blocks:[
{t:'sec',h:[`Why study materials?`,`لماذا ندرس المواد؟`],p:[
[`Materials touch transportation, health, housing, clothing, communication and food production. Societies advanced as they learned to produce and manipulate materials.`,`تدخل المواد في النقل والصحة والسكن والملبس والاتصالات وإنتاج الغذاء، وتقدّمت المجتمعات بقدر ما أتقنت إنتاج المواد وتطويعها.`],
[`Every engineer, including the biomedical engineer, eventually meets a design problem involving materials: biocompatible implants, orthopedics, orthodontics, surgical tools and instruments.`,`يواجه كل مهندس، ومنهم مهندس الطب الحيوي، مسألة تصميم تتعلق بالمواد: غرسات متوافقة حيوياً، جراحة العظام، تقويم الأسنان، والأدوات والأجهزة الجراحية.`]]},
{t:'table',h:[`Early civilizations are named after their materials`,`الحضارات المبكرة سُمّيت بحسب موادها`],cols:[[`Age`,`العصر`],[`Starts (approx.)`,`البداية (تقريباً)`]],rows:[[[`Stone Age`,`العصر الحجري`],`2.5 million BC`],[[`Bronze Age`,`العصر البرونزي`],`3500 BC`],[[`Iron Age`,`العصر الحديدي`],`1000 BC`]]},
{t:'sec',h:[`Materials science vs. materials engineering`,`علم المواد مقابل هندسة المواد`],p:[
[`<b>Materials science</b> investigates the relationships between the structures and properties of materials.`,`<b>علم المواد</b> يبحث في العلاقات بين بنية المواد وخواصها.`],
[`<b>Materials engineering</b> uses those structure–property relationships to design the structure of a material so it gives a required set of properties.`,`<b>هندسة المواد</b> تستفيد من علاقات البنية والخواص لتصميم بنية المادة بحيث تعطي مجموعة الخواص المطلوبة.`],
[`This understanding is only about 100 years old. Besides structure and properties, three more components matter: processing, characterization and performance.`,`هذا الفهم حديث (نحو 100 سنة). وإضافة إلى البنية والخواص هناك ثلاثة مكونات: المعالجة والتوصيف والأداء.`]]},
{t:'w',k:'tetra'},
{t:'tabs',h:[`Four levels of structure`,`مستويات البنية الأربعة`],items:[
{n:[`1 Subatomic`,`1 دون ذرية`],p:[[`Electrons inside individual atoms and their interactions with the nuclei.`,`الإلكترونات داخل الذرات المنفردة وتفاعلاتها مع الأنوية.`]]},
{n:[`2 Atomic`,`2 ذرية`],p:[[`The organization of atoms or molecules relative to one another.`,`تنظيم الذرات أو الجزيئات بالنسبة لبعضها.`]]},
{n:[`3 Microscopic`,`3 مجهرية`],p:[[`Large groups of atoms that are normally agglomerated together.`,`مجموعات كبيرة من الذرات تتجمع عادةً مع بعضها.`]]},
{n:[`4 Macroscopic`,`4 عيانية`],p:[[`Elements that can be viewed with the naked eye.`,`عناصر يمكن رؤيتها بالعين المجردة.`]]}]},
{t:'sec',h:[`Six families of material properties`,`ست عائلات من خواص المواد`],u:[
[`<b>Mechanical</b>`,`<b>ميكانيكية</b>`],[`<b>Electrical</b>`,`<b>كهربائية</b>`],[`<b>Thermal</b>`,`<b>حرارية</b>`],[`<b>Magnetic</b>`,`<b>مغناطيسية</b>`],[`<b>Optical</b>`,`<b>ضوئية</b>`],[`<b>Deteriorative</b> (how the material degrades in service)`,`<b>تدهورية</b> (كيف تتدهور المادة أثناء الخدمة)`]]},
{t:'tabs',h:[`Classification of materials`,`تصنيف المواد`],items:[
{n:[`Metals`,`المعادن`],p:[[`Combinations of metallic elements with many non-localized electrons, not bound to particular atoms. Many properties come directly from these electrons.`,`تراكيب من عناصر فلزية فيها أعداد كبيرة من الإلكترونات غير المتمركزة وغير المرتبطة بذرات محددة، ومنها تنشأ كثير من خواصها.`]],u:[[`Good conductors of electricity and heat`,`موصلة جيدة للكهرباء والحرارة`],[`Opaque, lustrous when polished`,`معتمة وبراقة عند صقلها`],[`Quite strong, yet deformable`,`قوية نسبياً وقابلة للتشكيل`]]},
{n:[`Ceramics`,`السيراميك`],p:[[`Compounds between metallic and nonmetallic elements, most often oxides, nitrides and carbides.`,`مركبات بين عناصر فلزية وغير فلزية، وغالباً أكاسيد ونيتريدات وكربيدات.`]],u:[[`Insulators to electricity and heat`,`عازلة للكهرباء والحرارة`],[`More resistant to high temperatures and harsh environments than metals and polymers`,`أكثر مقاومة للحرارة العالية والبيئات القاسية من المعادن والبوليمرات`],[`Hard but very brittle`,`صلبة لكنها هشّة جداً`]]},
{n:[`Polymers`,`البوليمرات`],p:[[`Plastics and rubbers. Many are organic compounds based on carbon, hydrogen and other nonmetals, with very large molecular structures.`,`اللدائن والمطاط. كثير منها مركبات عضوية أساسها الكربون والهيدروجين وعناصر لا فلزية أخرى، ذات جزيئات كبيرة جداً.`]],u:[[`Low density, may be extremely flexible`,`كثافة منخفضة وقد تكون شديدة المرونة`],[`Most synthetic polymers resist chemical attack, corrosion and moisture, so they degrade slowly in the environment`,`تقاوم معظم البوليمرات الصناعية الهجوم الكيميائي والتآكل والرطوبة، لذلك تتحلل ببطء في البيئة`],[`Poor conductors of electricity and heat (wire insulation)`,`موصلة ضعيفة للكهرباء والحرارة (عزل الأسلاك)`]]},
{n:[`Composites`,`المواد المركبة`],p:[[`Engineered from more than one material type. Fiberglass is the familiar example: glass fibers embedded in a polymer. A composite is designed to combine strength and flexibility.`,`مواد مهندسة من أكثر من نوع من المواد. مثالها المعروف الألياف الزجاجية: ألياف زجاج مغموسة في بوليمر. تُصمَّم لتجمع بين القوة والمرونة.`]]},
{n:[`Semiconductors`,`أشباه الموصلات`],p:[[`Electrical properties between those of conductors and insulators. Their behavior is extremely sensitive to tiny concentrations of impurity atoms and to temperature.`,`خواصها الكهربائية بين الموصلات والعوازل، وهي شديدة الحساسية لتراكيز ضئيلة من ذرات الشوائب ولدرجة الحرارة.`]]}]},
{t:'sec',h:[`What is a biomaterial?`,`ما المادة الحيوية؟`],p:[
[`Engineering is also about what is inside us: implants, artificial limbs, bandages. Technically any material could be tried, but to succeed it must be compatible with the biological system.`,`الهندسة لا تخص ما حولنا فقط بل ما بداخلنا أيضاً: الغرسات والأطراف الصناعية والضمادات. يمكن نظرياً تجربة أي مادة، لكن نجاحها يتطلب توافقها مع النظام الحيوي.`],
[`<b>Biomaterial:</b> any substance, synthetic or natural or a combination, used for some time as a whole or part of a system that treats, augments, diagnoses or replaces any tissue, organ or function of the body. It must not produce toxic substances and must be compatible with body tissues.`,`<b>المادة الحيوية:</b> أي مادة، صناعية أو طبيعية أو مزيج منهما، تُستخدم لفترة كاملةً أو جزءاً من منظومة تعالج أو تعزز أو تشخّص أو تعوّض أي نسيج أو عضو أو وظيفة في الجسم. ويجب ألا تنتج مواد سامة وأن تتوافق مع أنسجة الجسم.`],
[`<b>Biocompatible</b> materials give healthy responses: no blood clots, no infection, normal uncomplicated healing, often for months, years or decades.`,`المواد <b>المتوافقة حيوياً</b> تعطي استجابات سليمة: لا جلطات ولا عدوى والتئام طبيعي غير معقّد، وغالباً لأشهر أو سنوات أو عقود.`]]},
{t:'tabs',h:[`Four ways a material can interact with the body`,`أربع طرق لتفاعل المادة مع الجسم`],items:[
{n:[`1 Harm`,`1 تؤذي`],p:[[`It can hurt us: toxic or damaging materials are unusable.`,`قد تؤذينا: المواد السامة أو الضارة لا تصلح للاستخدام.`]]},
{n:[`2 Dissolve`,`2 تذوب`],p:[[`It can dissolve and be replaced by cells.`,`قد تذوب وتحل محلها الخلايا.`]],note:[`Later lectures call this <b>bioresorbable</b> (e.g. tricalcium phosphate, PLA).`,`تُسمى في المحاضرات اللاحقة <b>قابلة للامتصاص حيوياً</b> (مثل فوسفات الكالسيوم الثلاثي وPLA).`]},
{n:[`3 Encapsulate`,`3 تُغلَّف`],p:[[`Our body can surround it with a protective layer.`,`قد يحيطها الجسم بطبقة واقية.`]],note:[`This is the <b>bioinert</b> behavior (alumina, zirconia).`,`هذا سلوك المواد <b>الخاملة حيوياً</b> (الألومينا والزركونيا).`]},
{n:[`4 Bond`,`4 ترتبط`],p:[[`It can bond with living tissue.`,`قد ترتبط بالنسيج الحي.`]],note:[`This is the <b>bioactive</b> behavior (hydroxyapatite, bioglass).`,`هذا سلوك المواد <b>النشطة حيوياً</b> (الهيدروكسي أباتايت والزجاج الحيوي).`]}]},
{t:'table',h:[`Drugs vs. biomaterials`,`الأدوية مقابل المواد الحيوية`],cols:[[`Biomaterials`,`المواد الحيوية`],[`Drugs`,`الأدوية`]],rows:[
[[`Structural or carrier role, designed with biocompatibility to house, deliver or replace biological components, with no intrinsic pharmacological action`,`دور هيكلي أو ناقل، مصمم بتوافق حيوي لاحتضان المكونات الحيوية أو توصيلها أو تعويضها دون فعل دوائي ذاتي`],[`Pharmacologically active molecules that alter a biochemical pathway or metabolic function`,`جزيئات فعالة دوائياً تغيّر مساراً كيميائياً حيوياً أو وظيفة أيضية`]],
[[`Provide mechanical support, replace damaged tissue (bone grafts, heart valves) or carry drugs through the body`,`توفر دعماً ميكانيكياً أو تعوّض نسيجاً تالفاً (طعوم العظام، صمامات القلب) أو تنقل الأدوية في الجسم`],[`Exert direct therapeutic or curative effects on cellular targets`,`تُحدث تأثيراً علاجياً مباشراً على أهداف خلوية`]],
[[`Work through physical, chemical or structural properties: controlled degradation rate, porosity, surface chemistry`,`تعمل عبر خواص فيزيائية أو كيميائية أو بنيوية: معدل تحلل متحكم به، مسامية، كيمياء السطح`],[`Bind to specific receptors, enzymes or DNA to trigger a physiological response`,`ترتبط بمستقبلات أو إنزيمات أو DNA محددة لإحداث استجابة فيزيولوجية`]]]},
{t:'sec',h:[`Can drugs and biomaterials work together?`,`هل يمكن أن تعمل الأدوية والمواد الحيوية معاً؟`],p:[
[`Yes. In drug delivery systems, biomaterials such as polymer nanoparticles, liposomes or hydrogels protect sensitive drugs from degradation and control when the drug is released.`,`نعم. في أنظمة توصيل الدواء تحمي مواد حيوية مثل الجسيمات النانوية البوليمرية والليبوسومات والهلاميات المائية الأدوية الحساسة من التحلل وتتحكم بتوقيت إطلاقها.`]]}],
cards:[
[`Materials science`,`علم المواد`,`Studies the relationship between structure and properties.`,`يدرس العلاقة بين البنية والخواص.`],
[`Materials engineering`,`هندسة المواد`,`Designs a material's structure to obtain a predetermined set of properties.`,`تصمم بنية المادة للحصول على مجموعة خواص محددة مسبقاً.`],
[`Five components`,`المكونات الخمسة`,`Structure, properties, processing, characterization, performance.`,`البنية، الخواص، المعالجة، التوصيف، الأداء.`],
[`Ceramic`,`السيراميك`,`Metal + nonmetal compound (oxide, nitride, carbide); insulating, hard, brittle.`,`مركب فلز + لافلز (أكسيد، نيتريد، كربيد)؛ عازل وصلب وهش.`],
[`Composite`,`مادة مركبة`,`More than one material type, e.g. glass fibers in a polymer.`,`أكثر من نوع من المواد، مثل ألياف زجاج في بوليمر.`],
[`Semiconductor`,`شبه موصل`,`Conductivity between conductor and insulator; very sensitive to impurities and temperature.`,`توصيله بين الموصل والعازل؛ شديد الحساسية للشوائب والحرارة.`],
[`Biomaterial`,`مادة حيوية`,`A synthetic or natural substance that treats, augments, diagnoses or replaces tissue, organ or function.`,`مادة صناعية أو طبيعية تعالج أو تعزز أو تشخّص أو تعوّض نسيجاً أو عضواً أو وظيفة.`],
[`Biocompatible`,`متوافق حيوياً`,`Gives healthy responses: no clots, no infection, normal healing.`,`يعطي استجابات سليمة: لا جلطات ولا عدوى والتئام طبيعي.`]],
quiz:[
{q:[`What does materials science investigate?`,`ما الذي يبحث فيه علم المواد؟`],o:[[`The cost of raw materials`,`كلفة المواد الخام`],[`Relationships between structure and properties`,`العلاقات بين البنية والخواص`],[`Only the behavior of metals`,`سلوك المعادن فقط`],[`How drugs bind receptors`,`كيف ترتبط الأدوية بالمستقبلات`]],a:1,e:[`Science studies structure–property relationships; engineering uses them to design materials.`,`العلم يدرس علاقات البنية والخواص، والهندسة تستعملها لتصميم المواد.`]},
{q:[`Which is NOT one of the five components of materials science and engineering?`,`أي مما يلي ليس من المكونات الخمسة لعلم المواد وهندستها؟`],o:[[`Processing`,`المعالجة`],[`Characterization`,`التوصيف`],[`Performance`,`الأداء`],[`Sterilization`,`التعقيم`]],a:3,e:[`The five are structure, properties, processing, characterization and performance.`,`الخمسة هي البنية والخواص والمعالجة والتوصيف والأداء.`]},
{q:[`A material that is a metal–nonmetal compound, insulating, hard but very brittle is a:`,`مادة هي مركب فلز–لافلز، عازلة، صلبة وهشّة جداً، هي:`],o:[[`Metal`,`معدن`],[`Ceramic`,`سيراميك`],[`Polymer`,`بوليمر`],[`Semiconductor`,`شبه موصل`]],a:1,e:[`These are the general features of ceramics.`,`هذه هي الخصائص العامة للسيراميك.`]},
{q:[`Fiberglass, glass fibers in a polymer, is an example of a:`,`الألياف الزجاجية (ألياف زجاج في بوليمر) مثال على:`],o:[[`Composite`,`مادة مركبة`],[`Metal`,`معدن`],[`Semiconductor`,`شبه موصل`],[`Ceramic`,`سيراميك`]],a:0,e:[`A composite combines more than one material type.`,`المادة المركبة تجمع أكثر من نوع من المواد.`]},
{q:[`Which statement describes a biomaterial (as opposed to a drug)?`,`أي عبارة تصف المادة الحيوية (مقارنة بالدواء)؟`],o:[[`It alters a metabolic pathway`,`تغيّر مساراً أيضياً`],[`It binds receptors or enzymes`,`ترتبط بالمستقبلات أو الإنزيمات`],[`It acts as a structural or carrier material without intrinsic pharmacological action`,`تعمل كمادة هيكلية أو ناقلة دون فعل دوائي ذاتي`],[`It must always be soluble`,`يجب أن تكون دائماً قابلة للذوبان`]],a:2,e:[`Biomaterials rely on physical, chemical or structural properties, not pharmacology.`,`تعتمد المواد الحيوية على خواص فيزيائية وكيميائية وبنيوية لا على الفعل الدوائي.`]},
{q:[`The electrical behavior of semiconductors is extremely sensitive to:`,`السلوك الكهربائي لأشباه الموصلات شديد الحساسية لـ:`],o:[[`Color`,`اللون`],[`Impurity atoms and temperature`,`ذرات الشوائب ودرجة الحرارة`],[`Density only`,`الكثافة فقط`],[`Magnetic field direction`,`اتجاه المجال المغناطيسي`]],a:1,e:[`Even minute impurity concentrations change semiconductor behavior.`,`حتى التراكيز الضئيلة من الشوائب تغيّر سلوك شبه الموصل.`]},
{q:[`Which is a typical feature of polymers?`,`أي مما يلي صفة نموذجية للبوليمرات؟`],o:[[`Low density and possible high flexibility`,`كثافة منخفضة ومرونة قد تكون عالية`],[`Excellent electrical conductivity`,`توصيل كهربائي ممتاز`],[`Lustrous opaque surface`,`سطح معتم لامع`],[`Always brittle`,`هشّة دائماً`]],a:0,e:[`Polymers are light, often flexible, and poor conductors.`,`البوليمرات خفيفة وغالباً مرنة وضعيفة التوصيل.`]}]};

D[1]={title:[`Solid Structure: Bonding, Crystals and X-ray Diffraction`,`البنية الصلبة: الروابط والبلورات وحيود الأشعة السينية`],src:`Solid Structure`,blocks:[
{t:'sec',h:[`Fundamental concepts`,`المفاهيم الأساسية`],p:[
[`Each atom has a tiny nucleus of protons and neutrons, encircled by moving electrons. Electrons and protons carry charge of magnitude 1.6×10<sup>-19</sup> C (negative for electrons, positive for protons); neutrons are neutral.`,`تتكون الذرة من نواة صغيرة جداً من بروتونات ونيوترونات تحيط بها إلكترونات متحركة. للإلكترون والبروتون شحنة مقدارها 1.6×10<sup>-19</sup> كولوم (سالبة للإلكترون وموجبة للبروتون) والنيوترون متعادل.`],
[`<b>Atomic number Z</b> = number of protons (defines the element). <b>Mass number A</b> = protons + neutrons. Atoms of one element with different neutron numbers N are <b>isotopes</b>; the atomic weight is the weighted average of the mass numbers of natural isotopes.`,`<b>العدد الذري Z</b> = عدد البروتونات (يحدد العنصر). <b>العدد الكتلي A</b> = البروتونات + النيوترونات. الذرات من العنصر نفسه المختلفة بعدد النيوترونات N تسمى <b>نظائر</b>، والوزن الذري هو المتوسط الموزون للأعداد الكتلية للنظائر الطبيعية.`]]},
{t:'table',cols:[[`Particle`,`الجسيم`],[`Charge (C)`,`الشحنة (C)`],[`Mass (kg)`,`الكتلة (kg)`]],rows:[[[`Proton`,`بروتون`],`+1.6×10<sup>-19</sup>`,`1.67×10<sup>-27</sup>`],[[`Neutron`,`نيوترون`],`0`,`1.67×10<sup>-27</sup>`],[[`Electron`,`إلكترون`],`-1.6×10<sup>-19</sup>`,`9.11×10<sup>-31</sup>`]]},
{t:'tabs',h:[`Atomic models: a timeline`,`النماذج الذرية: تسلسل زمني`],items:[
{n:[`Democritus (442 BC)`,`ديمقريطس (442 ق.م)`],p:[[`Matter consists of invisible, indivisible, solid, homogeneous atoms that differ in size, shape, mass, position and arrangement.`,`المادة تتكون من ذرات غير مرئية وغير قابلة للتجزئة وصلبة ومتجانسة، تختلف في الحجم والشكل والكتلة والموضع والترتيب.`]]},
{n:[`Dalton (1807)`,`دالتون (1807)`],p:[[`First complete attempt to describe all matter by atoms: atoms are indivisible; atoms of one element are identical; compounds combine different atoms; a chemical reaction rearranges atoms.`,`أول محاولة متكاملة لوصف المادة بالذرات: الذرات غير قابلة للتجزئة؛ ذرات العنصر الواحد متماثلة؛ المركبات اتحاد ذرات مختلفة؛ والتفاعل الكيميائي إعادة ترتيب للذرات.`]]},
{n:[`Thomson (1904)`,`طومسون (1904)`],p:[[`Plum pudding model: negative electrons distributed in a uniform sea of positive charge.`,`نموذج حلوى البرقوق: إلكترونات سالبة موزعة في بحر منتظم من الشحنة الموجبة.`]]},
{n:[`Rutherford`,`رذرفورد`],p:[[`Nuclear model: a high charge concentrated in a very small central volume (the nucleus) that also holds most of the atomic mass.`,`النموذج النووي: شحنة عالية متركزة في حجم مركزي صغير جداً (النواة) تحوي أيضاً معظم كتلة الذرة.`]]},
{n:[`Bohr`,`بور`],p:[[`Electrons revolve in discrete orbits and have quantized energies. An electron changes energy only by a quantum jump to a higher level (absorbing energy) or lower level (emitting energy).`,`تدور الإلكترونات في مدارات محددة وطاقاتها مكمّاة. ولا تتغير طاقة الإلكترون إلا بقفزة كمية إلى مستوى أعلى (امتصاص طاقة) أو أدنى (إصدار طاقة).`]]},
{n:[`Quantum-mechanical`,`الميكانيكا الكمية`],p:[[`Bohr's model could not explain several electron phenomena. The electron is treated as having both wave-like and particle-like character, and its position is described as a probability rather than an orbit.`,`لم يستطع نموذج بور تفسير عدة ظواهر للإلكترونات. يُعامل الإلكترون بأنه ذو طبيعة موجية وجسيمية معاً، ويوصف موضعه باحتمال وليس بمدار.`]]}]},

{t:'sec',h:[`Types of secondary (van der Waals) bonds`,`أنواع الروابط الثانوية (فان در فالس)`],u:[
[`<b>Fluctuating induced dipole:</b> constant vibration briefly distorts an electrically symmetric atom, creating a tiny dipole that induces a dipole in a neighbor. These forces are temporary.`,`<b>ثنائي قطب مستحث متذبذب:</b> الاهتزاز الدائم يشوّه مؤقتاً تماثل ذرة متماثلة كهربائياً فينشأ ثنائي قطب صغير يستحث ثنائي قطب في الجار. وهذه القوى مؤقتة.`],
[`<b>Permanent dipole:</b> polar molecules (e.g. HCl) have an asymmetrical arrangement of positive and negative regions.`,`<b>ثنائي قطب دائم:</b> الجزيئات القطبية (مثل HCl) فيها توزيع غير متماثل للمناطق الموجبة والسالبة.`],
[`<b>Hydrogen bond:</b> the strongest secondary bond, a special case of polar-molecule bonding.`,`<b>الرابطة الهيدروجينية:</b> أقوى الروابط الثانوية وهي حالة خاصة من ترابط الجزيئات القطبية.`]]},
{t:'sec',h:[`Crystalline vs. amorphous, and the unit cell`,`البلورية مقابل غير المتبلورة، والخلية الوحدة`],p:[
[`A <b>crystalline</b> material has atoms in a repeating, periodic array over large distances (long-range order). All metals, many ceramics and some polymers are crystalline. Materials without this order are <b>non-crystalline (amorphous)</b>.`,`المادة <b>البلورية</b> ذراتها في ترتيب دوري متكرر على مسافات كبيرة (نظام بعيد المدى). كل المعادن وكثير من السيراميكات وبعض البوليمرات بلورية. أما المواد التي تفتقر لهذا النظام فهي <b>غير بلورية (غير متبلورة)</b>.`],
[`In the <b>hard-sphere model</b> atoms are solid spheres touching their nearest neighbors. A <b>lattice</b> is the 3-D array of points at atom positions. The <b>unit cell</b> is the basic building block that defines the crystal structure by its geometry and atom positions.`,`في <b>نموذج الكرات الصلبة</b> تُعد الذرات كرات صلبة تتلامس مع أقرب جيرانها. <b>الشبكة</b> مصفوفة ثلاثية الأبعاد من النقاط عند مواضع الذرات. و<b>الخلية الوحدة</b> هي وحدة البناء الأساسية التي تحدد البنية البلورية بهندستها ومواضع الذرات فيها.`]]},

[`BCC`,`2`,`8`,`0.68`,`a = 4R/√3`,`α-Fe`],

{t:'sec',h:[`Polymorphism and allotropy`,`تعدد الأشكال البلورية والتآصل`],p:[
[`Some materials have more than one crystal structure: <b>polymorphism</b>. For elements only, the term is <b>allotropy</b>. The stable structure depends on temperature and pressure.`,`بعض المواد لها أكثر من بنية بلورية: <b>تعدد الأشكال البلورية</b>. وللعناصر فقط يُسمى <b>التآصل</b>. وتعتمد البنية المستقرة على درجة الحرارة والضغط.`],
[`Examples: carbon is graphite at ambient conditions and diamond at extreme pressure; α-iron is BCC at room temperature and becomes FCC at 912 °C.`,`أمثلة: الكربون جرافيت في الظروف العادية وألماس عند ضغط عالٍ جداً؛ والحديد α بنيته BCC عند درجة حرارة الغرفة ويتحول إلى FCC عند 912 °م.`]]},
{t:'sec',h:[`Single crystals and the Czochralski (CZ) method`,`البلورات المفردة وطريقة تشوخرالسكي`],p:[
[`In a <b>single crystal</b> the periodic arrangement is perfect and runs through the whole specimen; all unit cells have the same orientation.`,`في <b>البلورة المفردة</b> الترتيب الدوري كامل ويمتد عبر العينة كلها، وكل الخلايا الوحدة لها الاتجاه نفسه.`],
[`<b>CZ method</b> (Jan Czochralski, 1916) grows a large single-crystal ingot in three steps:`,`<b>طريقة CZ</b> (يان تشوخرالسكي، 1916) تُنمّي سبيكة بلورة مفردة كبيرة بثلاث خطوات:`]],u:[
[`1. Melting the raw material in a crucible`,`1. صهر المادة الخام في بوتقة`],[`2. Seeding: dipping a small seed crystal into the melt`,`2. التبذير: غمس بلورة بذرة صغيرة في المصهور`],[`3. Rotating and slowly pulling the seed upward`,`3. تدوير البذرة وسحبها ببطء إلى الأعلى`]]},
{t:'sec',h:[`Polycrystalline materials`,`المواد متعددة البلورات`],p:[
[`Most crystalline solids consist of many small crystals called <b>grains</b>, each with identical atomic arrangement inside. Orientation differs from grain to grain, so atoms mismatch where two grains meet: the <b>grain boundary</b>.`,`معظم المواد البلورية تتكون من بلورات صغيرة كثيرة تسمى <b>حبيبات</b>، الترتيب الذري داخل كل منها متطابق. يختلف الاتجاه من حبيبة لأخرى فينشأ عدم تطابق ذري عند ملتقى حبيبتين: <b>حد الحبيبة</b>.`]]},

D[2]={title:[`Metallic Biomaterials`,`المواد الحيوية المعدنية`],src:`Metallic Biomaterials`,blocks:[
{t:'sec',h:[`Why metals in the body?`,`لماذا المعادن في الجسم؟`],p:[
[`Metallic bonding is essentially non-directional, so metal ions can shift without destroying the crystal: the solid deforms plastically.`,`الترابط الفلزي غير اتجاهي أساساً، لذا يمكن أن تنزاح الأيونات الفلزية دون تدمير البلورة، فيتشوه الصلب لدنياً.`]],u:[
[`<b>Passive substitutes for hard tissue:</b> total hip and knee joints, bone plates and screws, spinal fixation, dental implants (excellent mechanical properties and corrosion resistance).`,`<b>بدائل سلبية للنسيج الصلب:</b> مفاصل الورك والركبة الكاملة، صفائح العظام ومسامير تثبيتها، تثبيت العمود الفقري، غرسات الأسنان (خواص ميكانيكية ممتازة ومقاومة تآكل).`],
[`<b>Passive devices delivered through catheters:</b> vascular stents, catheter guide wires.`,`<b>أجهزة سلبية تُوصَل عبر القسطرة:</b> دعامات الأوعية الدموية وأسلاك توجيه القسطرة.`],
[`<b>Active implants:</b> pacemakers and cochlear implants.`,`<b>غرسات فعّالة:</b> أجهزة تنظيم ضربات القلب وغرسات القوقعة.`],
[`The first alloy made for human use was <b>vanadium steel</b> (Sherman bone plates and screws). Fe, Cr, Co, Ni, Ti, Ta, Nb, Mo, W are tolerated only in minute amounts; Fe helps red blood cells and Co takes part in vitamin B12, but large amounts are not tolerated.`,`أول سبيكة صُنعت للاستخدام البشري هي <b>الفاناديوم ستيل</b> (صفائح ومسامير شيرمان للعظام). تتحمل الأجسام Fe وCr وCo وNi وTi وTa وNb وMo وW بكميات ضئيلة فقط؛ فالحديد يفيد كريات الدم الحمراء والكوبالت يشارك في فيتامين B12، لكن الكميات الكبيرة غير مقبولة.`],
[`Main worry: <b>corrosion in vivo</b>. It weakens the implant and the corrosion products harm surrounding tissues and organs.`,`القلق الرئيسي: <b>التآكل داخل الجسم</b>، فهو يضعف الغرسة وتؤذي نواتجه الأنسجة والأعضاء المجاورة.`]]},
{t:'sec',h:[`Stainless steels: from 18-8 to 316L`,`الفولاذ المقاوم للصدأ: من 18-8 إلى 316L`],u:[
[`<b>18-8</b> (type 302) was the first stainless steel for implants: stronger and more corrosion resistant than vanadium steel, which is no longer used in vivo.`,`<b>18-8</b> (النوع 302) أول فولاذ مقاوم للصدأ للغرسات: أقوى وأكثر مقاومة للتآكل من الفاناديوم ستيل الذي لم يعد يُستخدم داخل الجسم.`],
[`Adding a little Mo gave <b>type 316</b>: better corrosion resistance in chloride solution and against pitting.`,`إضافة قليل من Mo أعطت <b>النوع 316</b>: مقاومة تآكل أفضل في محلول الكلوريد وضد التنقر.`],
[`In the 1950s carbon was cut from 0.08% to max 0.03%: <b>316L</b>. Less carbon means fewer carbides, less chromium depletion near the grains, and no <b>intergranular corrosion</b> (sensitization).`,`في الخمسينيات خُفّض الكربون من 0.08% إلى 0.03% كحد أقصى: <b>316L</b>. كربون أقل يعني كربيدات أقل ونضوباً أقل للكروم قرب الحبيبات، وبالتالي لا <b>تآكل بين الحبيبات</b> (التحسس).`],
[`Chromium must be at least <b>11%</b> for corrosion resistance; passivating in 30% nitric acid gives excellent resistance.`,`يجب ألا يقل الكروم عن <b>11%</b> للمقاومة؛ والتخميل في حمض النيتريك 30% يعطي مقاومة ممتازة.`],
[`Nickel stabilizes the FCC <b>austenitic</b> phase; the alloy is nonmagnetic. ASTM recommends 316L over 316 for implants.`,`النيكل يثبّت الطور <b>الأوستنيتي</b> FCC؛ والسبيكة غير مغناطيسية. وتوصي ASTM بـ316L بدلاً من 316 للغرسات.`],
[`Even 316L can corrode in highly stressed, oxygen-depleted spots (under the screws of a fracture plate), so it suits only <b>temporary</b> devices: fracture plates, screws, hip nails. Passivation and nitrogen-ion implantation improve corrosion, wear and fatigue.`,`حتى 316L قد يتآكل في مناطق عالية الإجهاد ناقصة الأكسجين (تحت مسامير صفيحة الكسر)، لذلك يناسب الأجهزة <b>المؤقتة</b> فقط: صفائح الكسور والمسامير ومسامير الورك. وتحسّن عملية التخميل وزرع أيونات النيتروجين المقاومة للتآكل والبلى والكلال.`]]},
{t:'tabs',h:[`Why 316 / 316L cannot be hardened by heat treatment`,`لماذا لا يمكن تصليد 316 / 316L بالمعالجة الحرارية`],items:[
{n:[`1 Austenitic structure`,`1 بنية أوستنيتية`],p:[[`High nickel keeps the crystal FCC at all temperatures from room temperature to melting.`,`النيكل العالي يُبقي البلورة FCC عند كل الدرجات من حرارة الغرفة حتى الانصهار.`]]},
{n:[`2 No phase change`,`2 لا تحول طوري`],p:[[`Normal hardening heats steel to austenite then quenches to trap carbon as hard martensite. Because 316 stays austenitic, quenching does not change its hardness.`,`التصليد المعتاد يسخّن الفولاذ إلى أوستنيت ثم يُبرَّد فجأة لحبس الكربون في المارتنسيت الصلب. ولأن 316 يبقى أوستنيتياً فإن التبريد السريع لا يغيّر صلادته.`]]},
{n:[`3 Low carbon`,`3 كربون منخفض`],p:[[`With at most 0.08% (0.03% for 316L) carbon there are too few carbon atoms to trigger martensitic transformation.`,`مع كربون لا يزيد عن 0.08% (0.03% في 316L) لا توجد ذرات كربون كافية لإحداث التحول المارتنسيتي.`]]}],},
{t:'table',h:[`Composition of 316L (ASTM F139)`,`تركيب 316L (ASTM F139)`],cols:[[`Element`,`العنصر`],[`Composition (%)`,`النسبة (%)`]],rows:[[[`Carbon`,`كربون`],`0.03 max`],[[`Manganese`,`منغنيز`],`2.00 max`],[[`Phosphorus`,`فوسفور`],`0.03 max`],[[`Sulfur`,`كبريت`],`0.03 max`],[[`Silicon`,`سيليكون`],`0.75 max`],[[`Chromium`,`كروم`],`17.00–20.00`],[[`Nickel`,`نيكل`],`12.00–14.00`],[[`Molybdenum`,`موليبدينوم`],`2.00–4.00`]]},
{t:'table',h:[`Mechanical properties of 316L for implants`,`الخواص الميكانيكية لـ316L للغرسات`],cols:[[`Condition`,`الحالة`],[`UTS min (MPa)`,`مقاومة الشد القصوى (MPa)`],[`Yield 0.2% (MPa)`,`الخضوع 0.2% (MPa)`],[`Elongation (%)`,`الاستطالة (%)`],`Rockwell`],rows:[[[`Annealed`,`ملدّن`],`485`,`172`,`40`,`95 HRB`],[[`Cold-worked`,`مشغّل على البارد`],`860`,`690`,`12`,`—`]],note:[`Cold working raises strength a lot but cuts ductility: elongation drops from 40% to 12%.`,`التشغيل على البارد يرفع المقاومة كثيراً لكنه يقلل الليونة: تنخفض الاستطالة من 40% إلى 12%.`]},
{t:'w',k:'precip'},
{t:'sec',h:[`Cold working (strain hardening)`,`التشغيل على البارد (التصلب بالانفعال)`],p:[
[`Load a ductile metal past yielding (point 1) up to point 2 and unload: permanent plastic deformation remains, the <b>residual strain</b> or permanent set. Reload it, and it now yields only at point 2. The yield strength has risen.`,`حمّل معدناً ليّناً بعد الخضوع (النقطة 1) حتى النقطة 2 ثم أزل الحمل: تبقى تشوهات لدنة دائمة هي <b>الانفعال المتبقي</b>. أعد التحميل فلا يخضع إلا عند النقطة 2. أي ارتفع إجهاد الخضوع.`],
[`Cause: plastic deformation increases the <b>dislocation density</b>, and the dislocations interact with each other and resist further motion.`,`السبب: التشوه اللدن يزيد <b>كثافة الانخلاعات</b> وتتفاعل الانخلاعات مع بعضها فتقاوم الحركة اللاحقة.`]]},
{t:'w',k:'cw'},
{t:'sec',h:[`Cobalt–chromium alloys`,`سبائك الكوبالت–كروم`],p:[
[`Two basic types: <b>castable CoCrMo</b> (dentistry for decades, more recently artificial joints) and <b>wrought CoNiCrMo</b> (hot forged; stems of prostheses for heavily loaded joints such as knee and hip).`,`نوعان أساسيان: <b>CoCrMo القابلة للسباكة</b> (في طب الأسنان منذ عقود وأخيراً المفاصل الصناعية) و<b>CoNiCrMo المطاوعة</b> (تُطرق ساخنة؛ سيقان الأطقم الاصطناعية للمفاصل عالية الحمل كالركبة والورك).`],
[`Mo gives finer grains (higher strength after casting or forging); Cr improves corrosion resistance and solid-solution strengthening.`,`يعطي Mo حبيبات أدق (مقاومة أعلى بعد السباكة أو الطرق)؛ ويحسّن Cr مقاومة التآكل ويقوّي المحلول الصلب.`]]},
{t:'table',h:[`ASTM CoCr alloys for surgical implants`,`سبائك CoCr حسب ASTM للغرسات الجراحية`],cols:[[`Code`,`الرمز`],[`Alloy`,`السبيكة`],[`Form`,`الشكل`]],rows:[[`F75`,`CoCrMo`,[`Cast`,`مسبوكة`]],[`F90`,`CoCrWNi`,[`Wrought`,`مطاوعة`]],[`F562`,`CoNiCrMo`,[`Wrought`,`مطاوعة`]],[`F563`,`CoNiCrMoWFe`,[`Wrought`,`مطاوعة`]]]},
{t:'sec',h:[`More on CoNiCrMo and biological response`,`المزيد عن CoNiCrMo والاستجابة الحيوية`],u:[
[`About 35% Co and 35% Ni; highly corrosion resistant even in chloride under stress. Cold working is difficult for large parts, so only <b>hot forging</b> makes large implants such as hip stems.`,`نحو 35% Co و35% Ni؛ شديدة المقاومة للتآكل حتى في الكلوريد تحت الإجهاد. التشغيل على البارد صعب للقطع الكبيرة، فالطرق الساخن وحده يصنع الغرسات الكبيرة كسيقان الورك.`],
[`Superior fatigue and tensile strength suit long service life; replacing a failed stem deep in the femoral canal is hard and revision surgery usually gives poorer fixation.`,`مقاومة الكلال والشد المتفوقة تناسب العمر الطويل؛ فاستبدال ساق فاشلة في عمق قناة عظم الفخذ صعب، والجراحة التصحيحية غالباً أسوأ تثبيتاً.`],
[`Nickel release at 37 °C in Ringer's solution was about <b>3×10<sup>-10</sup> g/cm²/day</b> for both CoNiCrMo and 316L, although CoNiCrMo has about three times the nickel.`,`كان تحرر النيكل عند 37 °م في محلول رينغر نحو <b>3×10<sup>-10</sup> غ/سم²/يوم</b> لكل من CoNiCrMo وسبيكة 316L رغم أن نيكل CoNiCrMo يعادل ثلاثة أضعاف تقريباً.`],
[`In vitro, particulate Co is toxic to osteoblast-like cells (it inhibits type-I collagen, osteocalcin, alkaline phosphatase); particulate Cr and CoCr are well tolerated. Co and Ni extracts at 50% were highly toxic; Cr extract was less toxic.`,`في المختبر، جسيمات Co سامة للخلايا الشبيهة بالبانيات للعظم (تثبط الكولاجين من النوع I والأوستيوكالسين والفوسفاتاز القلوي)، بينما جسيمات Cr وسبيكة CoCr مقبولة جيداً. وكانت مستخلصات Co وNi بتركيز 50% شديدة السمية، ومستخلص Cr أقل سمية.`],
[`Modulus of elasticity of CoCr alloys: <b>220–234 GPa</b>, higher than stainless steel, which changes how load transfers to bone.`,`معامل المرونة لسبائك CoCr: <b>220–234 GPa</b> وهو أعلى من الفولاذ المقاوم للصدأ، مما يغيّر نمط انتقال الحمل إلى العظم.`]]},
{t:'sec',h:[`Titanium and Ti-6Al-4V`,`التيتانيوم وسبيكة Ti-6Al-4V`],u:[
[`Light (4.5 g/cm³) with good mechanical and corrosion properties. Four grades of commercially pure Ti are separated by impurities; oxygen strongly affects ductility and strength.`,`خفيف (4.5 غ/سم³) وذو خواص ميكانيكية ومقاومة تآكل جيدة. أربع رتب من Ti التجاري النقي تتمايز بالشوائب، ولـالأكسجين تأثير كبير في الليونة والمقاومة.`],
[`<b>Ti-6Al-4V:</b> Al 5.5–6.5%, V 3.5–4.5%; fatigue strength about 550 MPa, similar to CoCr.`,`<b>Ti-6Al-4V:</b> Al بنسبة 5.5–6.5% وV بنسبة 3.5–4.5%؛ مقاومة كلال نحو 550 MPa أي قريبة من CoCr.`],
[`Ti is allotropic: <b>α-Ti (HCP)</b> up to 882 °C, <b>β-Ti (BCC)</b> above. <b>Al stabilizes α</b> (raises the transformation temperature); <b>V stabilizes β</b> (lowers it).`,`التيتانيوم متآصل: <b>α-Ti (HCP)</b> حتى 882 °م و<b>β-Ti (BCC)</b> فوقها. <b>الألمنيوم يثبّت α</b> (يرفع درجة التحول) و<b>الفاناديوم يثبّت β</b> (يخفضها).`],
[`Modulus about 110 GPa; best specific strength (strength per density) of all implant materials; but poor shear strength, so less desirable for bone screws and plates.`,`المعامل نحو 110 GPa؛ أفضل مقاومة نوعية (المقاومة لكل كثافة) بين مواد الغرسات؛ لكن مقاومة القص ضعيفة فلا يفضّل لمسامير وصفائح العظام.`],
[`Corrosion resistance comes from a solid <b>TiO<sub>2</sub> oxide layer about 10 nm</b> thick.`,`تأتي مقاومة التآكل من طبقة صلبة من <b>أكسيد TiO<sub>2</sub> بسماكة نحو 10 نانومتر</b>.`]]},
{t:'table',h:[`Mechanical properties of Ti and its alloys (ASTM F136)`,`الخواص الميكانيكية للتيتانيوم وسبائكه (ASTM F136)`],cols:[[`Property`,`الخاصية`],`Grade 1`,`Grade 2`,`Grade 3`,`Grade 4`,`Ti-6Al-4V`,`Ti-13Nb-13Zr`],rows:[
[[`Tensile strength (MPa)`,`مقاومة الشد (MPa)`],`240`,`345`,`450`,`550`,`860`,`1030`],
[[`Yield 0.2% (MPa)`,`الخضوع 0.2% (MPa)`],`170`,`275`,`380`,`485`,`795`,`900`],
[[`Elongation (%)`,`الاستطالة (%)`],`24`,`20`,`18`,`15`,`10`,`15`],
[[`Reduction of area (%)`,`نقص المساحة (%)`],`30`,`30`,`30`,`25`,`25`,`45`]]},
{t:'w',k:'dens'},
{t:'rev',h:[`Worked example: volume change of Ti at 882 °C`,`مثال محلول: تغير حجم التيتانيوم عند 882 °م`],p:[[`Titanium changes from HCP (a = 2.95 Å, c = 4.683 Å) to BCC (a = 3.32 Å) at 882 °C. Find the volume change in cm³/g. Density 4.54 g/cm³, atomic weight 47.9 g/mol.`,`يتحول التيتانيوم من HCP (a = 2.95 Å، c = 4.683 Å) إلى BCC (a = 3.32 Å) عند 882 °م. احسب تغير الحجم بوحدة سم³/غ. الكثافة 4.54 غ/سم³ والوزن الذري 47.9 غ/مول.`]],run:()=>{
  const a1=2.95,c=4.683,a2=3.32;const V1=1.5*Math.sqrt(3)*a1*a1*c,v1=V1/6,V2=a2**3,v2=V2/2,r=v2/v1,s0=1/4.54,ds=s0*(r-1);
  const f=x=>x.toFixed(3);
  return bi([`<b>1.</b> HCP cell volume = (3√3/2)·a²·c = ${V1.toFixed(2)} Å³ with 6 atoms, so ${f(v1)} Å³ per atom.`,`<b>1.</b> حجم خلية HCP = (3√3/2)·a²·c = ${V1.toFixed(2)} Å³ وفيها 6 ذرات، أي ${f(v1)} Å³ للذرة.`])+
  bi([`<b>2.</b> BCC cell volume = a³ = ${V2.toFixed(2)} Å³ with 2 atoms, so ${f(v2)} Å³ per atom.`,`<b>2.</b> حجم خلية BCC = a³ = ${V2.toFixed(2)} Å³ وفيها ذرتان، أي ${f(v2)} Å³ للذرة.`])+
  bi([`<b>3.</b> Volume ratio = ${f(r)}, an expansion of ${((r-1)*100).toFixed(1)}%.`,`<b>3.</b> نسبة الحجم = ${f(r)} أي تمدد بنسبة ${((r-1)*100).toFixed(1)}%.`])+
  bi([`<b>4.</b> Specific volume before = 1/4.54 = ${s0.toFixed(4)} cm³/g, so ΔV = ${s0.toFixed(4)} × ${(r-1).toFixed(4)} ≈ <b>+${ds.toFixed(4)} cm³/g</b>.`,`<b>4.</b> الحجم النوعي قبل التحول = 1/4.54 = ${s0.toFixed(4)} سم³/غ، فيكون ΔV = ${s0.toFixed(4)} × ${(r-1).toFixed(4)} ≈ <b>+${ds.toFixed(4)} سم³/غ</b>.`])}}],
